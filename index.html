<script type="module">
globalThis.__SINGLE_FILE__ = true;

/* ===== src/rng.js ===== */
// 可复现随机源：全部随机性都从 state.rngState 派生，方便回放与复盘。
function rnd(state) {
  let s = (state.rngState + 0x6d2b79f5) >>> 0;
  state.rngState = s;
  let t = s;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function randInt(state, n) {
  if (n <= 0) throw new Error('randInt: n 必须为正整数');
  return Math.floor(rnd(state) * n);
}
function pickOne(state, arr) {
  return arr[randInt(state, arr.length)];
}
function shuffle(state, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(state, i + 1);
    const t = a[i];
    a[i] = a[j];
    a[j] = t;
  }
  return a;
}

/* ===== src/cards.js ===== */
const ALIGNS = ['善', '恶'];
const ITEM_NAMES = ['武器', '皇冠', '隐身衣'];
const FUNCTION_NAMES = ['洞若观火', '重整', '颠倒是非', '铸剑为犁', '推心置腹', '沉默', '止戈'];
const DEFAULT_PERSON_COPIES = { 善: 6, 恶: 6 };
const DEFAULT_ITEM_COPIES = { 武器: 6, 皇冠: 2, 隐身衣: 1 };
const isPerson = (c) => c.kind === 'person';
const isItem = (c) => c.kind === 'item';
const isFunctionCard = (c) => c.kind === 'function';
const isCrown = (c) => c.kind === 'item' && c.name === '皇冠';
const isWeapon = (c) => c.kind === 'item' && c.name === '武器';
const isCloak = (c) => c.kind === 'item' && c.name === '隐身衣';
function label(c) {
  if (!c) return '(无)';
  return isPerson(c) ? `人(${c.align})` : c.name;
}
function buildCards(spec = {}) {
  const cards = {};
  let n = 0;
  const personCopies = spec.personCopies ?? DEFAULT_PERSON_COPIES;
  for (const align of ALIGNS) {
    for (let i = 0; i < (personCopies[align] ?? 0); i++) {
      const id = `p${++n}`;
      cards[id] = { id, kind: 'person', name: '人', align };
    }
  }
  let m = 0;
  const itemCopies = spec.itemCopies ?? DEFAULT_ITEM_COPIES;
  for (const name of ITEM_NAMES) {
    for (let i = 0; i < (itemCopies[name] ?? 0); i++) {
      const id = `i${++m}`;
      cards[id] = { id, kind: 'item', name, align: null };
    }
  }
  let k = 0;
  for (const name of FUNCTION_NAMES) {
    const copies = spec.functionCopies?.[name] ?? 1;
    for (let i = 0; i < copies; i++) {
      const id = `f${++k}`;
      cards[id] = { id, kind: 'function', name, align: null };
    }
  }
  return cards;
}

/* ===== src/rules.js ===== */
// 所有可调参数集中在这里，平衡性试玩只改这个文件。
const RULES = {
  initialHandSize: 4,          // 初始手牌 4 张
  crownCap: 1,                 // 手牌皇冠上限
  maxRounds: 40,               // 全局回合上限（A+B 记 1 个完整回合）
  stalemateRounds: 3,          // 牌堆耗尽后，连续 N 个完整回合无战斗胜负即结算
  zhiGeGoal: 1,                // 止戈计数达到该值 + 主牌堆为空 => 结算。阈值必须是 1：止戈全局只有 1 张，不可能"连续两次背靠背"
  zhiGeCopies: 1,              // 止戈张数：全局仅 1 张（牌组 28 张）
  passPenaltyAppliesToAllPassers: true, // 同时宣告模型下，未行动方"不出战"是否也吃惩罚
  revealHandCounts: false,     // 是否公开对手手牌数量（背水一战条款要求默认隐藏）
  revealDeckCount: false,      // 是否公开主牌堆剩余数量（默认隐藏：重整条款只告知抽到的牌，不提示牌堆剩余）
  revealDiscard: true,         // 弃牌堆是否公开
  drawDiscardsBattleCards: true, // 平局处理：true = 双方出战牌都进弃牌堆（不返还手牌，平局要实打实掉牌）
};
const IDENTITIES = ['骑士', '匪徒', '国王', '普通人', '贼'];

// 克制表：BEATS[x] = x 能克制的身份列表
const BEATS = {
  骑士: ['匪徒', '普通人'],
  匪徒: ['国王', '普通人'],
  国王: ['骑士'],
  普通人: ['国王'],
  贼: [], // Q2 决议：贼无克制，对任意身份均为平局
};
function compareIdentity(a, b) {
  if (BEATS[a]?.includes(b)) return 'a';
  if (BEATS[b]?.includes(a)) return 'b';
  return 'draw';
}

// Q2 决议：身份在出战组合锁定瞬间冻结，后续弃隐身衣/夺武器都不回溯身份。
function identityOf({ person, item }, berserk = false) {
  if (!person) throw new Error('出战组合必须包含人牌');
  if (!item) return berserk ? (person.align === '善' ? '骑士' : '匪徒') : '普通人';
  if (item.name === '武器') return person.align === '善' ? '骑士' : '匪徒';
  if (item.name === '皇冠') return '国王';
  if (item.name === '隐身衣') return '贼';
  throw new Error(`未知道具牌：${item.name}`);
}

/* ===== src/log.js ===== */
function pushEvent(state, event) {
  const e = { seq: (state.seq += 1), ...event };
  state.events.push(e);
  return e;
}

// 信息隐藏规则：功能牌结算只公开提示"结算完成"。
function complete(state) {
  pushEvent(state, { type: 'complete', scope: 'all', text: '结算完成' });
}

/* ===== src/view.js ===== */



const mirror = (id) => (id === 'A' ? 'B' : 'A');

// 每个玩家只拿到自己该看的信息：自己手牌明文，对手手牌只给"是否为空"。
function viewFor(state, playerId) {
  const me = state.players[playerId];
  const foe = state.players[mirror(playerId)];
  const info = (id) => ({ id, label: label(state.cards[id]), kind: state.cards[id].kind });
  return {
    you: playerId,
    turn: state.turn,
    round: state.round,
    phase: state.phase,
    yourHand: me.hand.map(info),
    yourHandCount: me.hand.length,
    yourSilenced: me.silenced,
    yourSeenThisTurn: me.seenThisTurn.map(info),
    yourBerserkEligible: Boolean(state.berserk[playerId]),
    opponentHandCount: RULES.revealHandCounts ? foe.hand.length : null,
    opponentHandEmpty: foe.hand.length === 0,
    deckCount: RULES.revealDeckCount ? state.deck.length : null,
    deckEmpty: state.deck.length === 0,
    discard: RULES.revealDiscard ? state.discard.map(info) : null,
    atWarCounter: state.atWarCounter,
    publicLog: state.events.filter((e) => e.scope === 'all').map((e) => e.text),
    privateLog: state.events.filter((e) => e.scope === 'private' && e.player === playerId).map((e) => e.text),
    pending: pendingView(state, playerId),
    winner: state.winner,
  };
}

function pendingView(state, playerId) {
  const p = state.pending;
  if (!p) return { kind: 'none' };
  if (p.kind === 'function-phase') {
    // 双方同时：自己交了就等对手，还没交就给出可打的能力牌
    const submitted = p.submitted.includes(playerId);
    const mine = state.players[playerId].hand.filter((id) => isFunctionCard(state.cards[id]));
    return {
      kind: 'function-phase',
      player: playerId,
      youSubmitted: submitted,
      waitingFor: submitted ? 'opponent' : 'you',
      hasFunction: mine.length > 0,
      playable: submitted ? [] : mine.map((id) => ({ id, label: label(state.cards[id]) })),
    };
  }
  if (p.kind === 'declare-phase') {
    const submitted = p.submitted.includes(playerId);
    return {
      kind: 'declare-phase',
      youSubmitted: submitted,
      waitingFor: submitted ? 'opponent' : 'you',
      yourFightable: state.players[playerId].hand
        .filter((id) => state.cards[id].kind === 'person')
        .map((id) => ({ id, label: label(state.cards[id]) })),
      yourItems: state.players[playerId].hand
        .filter((id) => state.cards[id].kind === 'item')
        .map((id) => ({ id, label: label(state.cards[id]) })),
    };
  }
  if (p.kind === 'battle-reward') {
    if (p.winner !== playerId) return { kind: 'battle-reward', text: '等待对手选择出战卡牌处理方式' };
    return { kind: 'battle-reward', winner: p.winner, options: ['keep', 'take'] };
  }
  return { kind: p.kind };
}

/* ===== src/redact.js ===== */
// 把服务端完整状态裁剪成「某个座位可以安全看到的状态壳」。
//
// 为什么需要它：web/app.js 的渲染层是直接读 state 的（st.players[x].hand / st.cards[id] / st.deck.length…），
// 而 viewFor() 只给出「该玩家能看到的语义信息」。联机时不能把完整 state 下发，
// 所以这里造一个「结构一样、但隐藏信息已被抹掉」的替身：
//   · 对手手牌 → 同长度的占位 id（渲染层只用 hand.length 画背面）
//   · 主牌堆    → 同长度的占位 id（渲染层只用 deck.length）
//   · 对手的背水一战 / 本回合窥探记录 → 一律清空
//   · 私有事件  → 只保留发给本人的；事件文案里的随机种子也抹掉（种子能反推整副牌序）
// 注意：真正给客户端的信息出口仍然是 viewFor()，这个函数只负责「渲染层别看到不该看的」。
const redactMirror = (id) => (id === 'A' ? 'B' : 'A');
const HIDDEN = '__hidden';
const FOE_BACKS = 3; // 对手手牌下发几张背面（真实张数不下发）
const EVENT_CAP = 800;
function stripSeed(text) {
  return String(text ?? '').replace(/（种子\s*\d+）/g, '').replace(/\s*种子\s*\d+/g, '');
}
function visibleEventsFor(state, seat) {
  const from = Math.max(0, state.events.length - EVENT_CAP);
  return state.events.slice(from)
    .filter((e) => e.scope === 'all' || (e.scope === 'private' && e.player === seat))
    .map((e) => {
      const data = { ...(e.data ?? {}) };
      delete data.seed;
      return { seq: e.seq, type: e.type, scope: e.scope, player: e.player, text: stripSeed(e.text), data };
    });
}
function redactState(state, seat) {
  const foe = redactMirror(seat);
  const over = Boolean(state.winner);
  // 对手手牌一律发「固定张数」的占位牌：连「对手还剩几张」这种能反推局势的信息也不下发
  const handOf = (who) => {
    if (over || who === seat) return state.players[who].hand.slice();
    if (!state.players[who].hand.length) return [];
    return Array.from({ length: FOE_BACKS }, (_, i) => HIDDEN + i);
  };
  return {
    code: state.code ?? null,
    cards: state.cards,
    deck: state.deck.map((_, i) => HIDDEN + i),
    discard: state.discard.slice(),
    players: {
      A: { hand: handOf('A'), silenced: state.players.A.silenced, seenThisTurn: [] },
      B: { hand: handOf('B'), silenced: state.players.B.silenced, seenThisTurn: [] },
    },
    turn: state.turn,
    round: state.round,
    phase: state.phase,
    atWarCounter: state.atWarCounter,
    berserk: over ? { A: state.berserk.A, B: state.berserk.B } : { [seat]: state.berserk[seat], [foe]: false },
    pending: state.pending ? { ...state.pending, submitted: state.pending.submitted ? state.pending.submitted.slice() : undefined } : null,
    winner: state.winner,
    events: visibleEventsFor(state, seat),
    seq: state.seq,
  };
}

/* ===== src/engine.js ===== */
const other = (id) => (id === 'A' ? 'B' : 'A');
function removeFrom(arr, id) {
  const i = arr.indexOf(id);
  if (i < 0) throw new Error(`卡牌不在集合中: ${id}`);
  arr.splice(i, 1);
  return id;
}

function mkPlayer(id) {
  return { id, hand: [], silenced: false, seenThisTurn: [] };
}

// ---------------------------------------------------------------- 建局

// 低层建局：只构造状态与洗牌，不发作手牌，便于测试注入确定性手牌。
function createState(seed = 1, opts = {}) {
  const spec = opts.cards ?? {};
  // 止戈张数由 RULES 统一控制，便于一行切换终局条款是否可达
  const cards = buildCards({
    ...spec,
    functionCopies: { 止戈: RULES.zhiGeCopies, ...(spec.functionCopies ?? {}) },
  });
  const state = {
    seed,
    rngState: (seed >>> 0) || 0x9e3779b9,
    cards,
    deck: [],
    discard: [],
    players: { A: mkPlayer('A'), B: mkPlayer('B') },
    turn: 'A',
    round: 1,
    turnIndex: 0,
    phase: 'draw',
    atWarCounter: 0,
    stalemateRounds: 0,
    decisiveThisRound: 0,
    turnZhiGePlayed: false,
    berserk: { A: false, B: false },
    declaration: null,            // { A:{fight,personCardId,itemCardId,identity}, B:{...} }
    battleZone: { A: [], B: [] }, // 已锁定、暂时离手的出战卡牌
    pending: null,
    winner: null,
    events: [],
    seq: 0,
  };
  state.deck = shuffle(state, Object.keys(cards));
  return state;
}
function dealInitial(state) {
  for (const id of ['A', 'B']) {
    for (let i = 0; i < RULES.initialHandSize; i++) drawTop(state, id);
  }
  pushEvent(state, { type: 'setup', scope: 'all', text: `开局：洗牌完成，A / B 各抽 ${RULES.initialHandSize} 张初始手牌（种子 ${state.seed}）` });
  return state;
}
function createGame(seed = 1, opts = {}) {
  const state = createState(seed, opts);
  dealInitial(state);
  advance(state);
  return state;
}

// ---------------------------------------------------------------- 基础操作
function drawTop(state, playerId) {
  if (state.deck.length === 0) return null;
  const cardId = state.deck.shift();
  acquire(state, playerId, cardId);
  return cardId;
}

// 所有获得卡牌的路径统一走这里，保证皇冠上限规则不会被绕过。
function acquire(state, playerId, cardId) {
  const c = state.cards[cardId];
  const p = state.players[playerId];
  if (isCrown(c) && p.hand.some((id) => isCrown(state.cards[id]))) {
    state.discard.push(cardId);
    pushEvent(state, { type: 'crown-overflow', scope: 'all', text: `${playerId} 皇冠超出上限，直接弃入弃牌堆`, data: { player: playerId } });
    return { placed: 'discard', overflow: true };
  }
  p.hand.push(cardId);
  return { placed: 'hand', overflow: false };
}

function returnBattleCards(state, playerId) {
  for (const cid of state.battleZone[playerId].slice()) {
    removeFrom(state.battleZone[playerId], cid);
    acquire(state, playerId, cid);
  }
}

function discardBattleCards(state, playerId) {
  for (const cid of state.battleZone[playerId].slice()) {
    removeFrom(state.battleZone[playerId], cid);
    state.discard.push(cid);
  }
}

function checkZeroHands(state) {
  const zeroA = state.players.A.hand.length === 0;
  const zeroB = state.players.B.hand.length === 0;
  if (!zeroA && !zeroB) return false;
  if (zeroA && zeroB) {
    state.winner = { kind: 'draw', reason: '双方手牌同时归零' };
  } else {
    state.winner = { kind: 'player', id: zeroA ? 'B' : 'A', reason: `${zeroA ? 'A' : 'B'} 手牌归零` };
  }
  pushEvent(state, { type: 'game-over', scope: 'all', text: `游戏结束：${state.winner.reason}` });
  return true;
}

function endByHands(state, reason) {
  const a = state.players.A.hand.length;
  const b = state.players.B.hand.length;
  if (a === b) state.winner = { kind: 'draw', reason: `${reason}；手牌 A=${a} / B=${b}，平局` };
  else state.winner = { kind: 'player', id: a > b ? 'A' : 'B', reason: `${reason}；手牌 A=${a} / B=${b}` };
  pushEvent(state, { type: 'game-over', scope: 'all', text: `游戏结束：${state.winner.reason}` });
}

// ---------------------------------------------------------------- 状态机
function advance(state) {
  let guard = 0;
  while (!state.winner && !state.pending) {
    if (++guard > 500) throw new Error('advance() 无法推进，疑似死循环');
    switch (state.phase) {
      case 'draw': phaseDraw(state); break;
      case 'function': phaseFunction(state); break;
      case 'berserk': phaseBerserk(state); break;
      case 'declare': phaseDeclare(state); break;
      case 'battle': phaseBattle(state); break;
      case 'end': phaseEnd(state); break;
      default: throw new Error(`未知阶段: ${state.phase}`);
    }
  }
  return state;
}

function phaseDraw(state) {
  const p = state.turn;
  if (state.deck.length === 0) {
    pushEvent(state, { type: 'draw-skip', scope: 'all', text: `主牌堆已空，${p} 跳过抽牌` });
  } else {
    drawTop(state, p);
    pushEvent(state, { type: 'draw', scope: 'all', text: `${p} 抽牌阶段：抽入 1 张` });
  }
  state.phase = 'function';
}

function phaseFunction(state) {
  // 能力牌阶段改成【双方同时】：两边各自私下选一张能力牌（或跳过），
  // 都提交完再一次性结算（按 A → B 顺序执行），和对抗宣告一样是 commit-reveal。
  const pending = { kind: 'function-phase', submitted: [], picks: {} };
  for (const id of ['A', 'B']) {
    if (!state.players[id].silenced) continue;
    state.players[id].silenced = false; // 沉默标记在功能牌阶段开始前清除
    pending.submitted.push(id);
    pending.picks[id] = null;
    pushEvent(state, { type: 'silenced', scope: 'all', text: id + ' 本回合被沉默：不能打出任何功能牌' });
  }
  if (pending.submitted.length === 2) { state.phase = 'berserk'; return; }
  state.pending = pending;
}
function phaseBerserk(state) {
  for (const id of ['A', 'B']) {
    const h = state.players[id].hand;
    state.berserk[id] = h.length === 1 && isPerson(state.cards[h[0]]);
    if (state.berserk[id]) {
      pushEvent(state, {
        type: 'berserk',
        scope: 'private',
        player: id,
        text: `背水一战判定（仅你可见）：手牌仅剩 1 张${label(state.cards[h[0]])}，若本回合出战将临时变身为${state.cards[h[0]].align === '善' ? '骑士' : '匪徒'}`,
      });
    }
  }
  state.phase = 'declare';
}

function phaseDeclare(state) {
  if (!state.declaration) {
    state.declaration = {};
    state.pending = { kind: 'declare-phase', submitted: [] };
  }
}

function phaseBattle(state) {
  const A = state.declaration.A;
  const B = state.declaration.B;
  const ids = ['A', 'B'];

  if (!A.fight || !B.fight) {
    for (const id of ids) if (state.declaration[id].fight) returnBattleCards(state, id);
    for (const passer of ids.filter((id) => !state.declaration[id].fight)) {
      if (passer !== state.turn && !RULES.passPenaltyAppliesToAllPassers) {
        pushEvent(state, { type: 'no-penalty', scope: 'all', text: `${passer} 选择不出战（非行动方，按配置免罚）` });
        continue;
      }
      applyPassPenalty(state, passer);
    }
    if (!state.winner) {
      pushEvent(state, { type: 'battle-skipped', scope: 'all', text: '未形成双方对战，跳过战斗结算' });
      state.phase = 'end';
    }
    return;
  }
  resolveBattle(state);
}

function applyPassPenalty(state, passer) {
  const taker = other(passer);
  const pool = state.players[passer].hand.filter((id) => !isFunctionCard(state.cards[id]));
  if (pool.length === 0) {
    pushEvent(state, { type: 'penalty-none', scope: 'all', text: `${passer} 不出战，但手牌中没有可被夺取的卡牌（功能牌不可转移）` });
    checkZeroHands(state);
    return;
  }
  const cardId = pool[randInt(state, pool.length)];
  removeFrom(state.players[passer].hand, cardId);
  acquire(state, taker, cardId);
  pushEvent(state, { type: 'penalty', scope: 'all', text: `${passer} 不出战惩罚：${taker} 随机夺走其 1 张手牌`, data: { passer, taker } });
  checkZeroHands(state);
}

function resolveBattle(state) {
  const ids = ['A', 'B'];
  const combo = (id) => {
    const d = state.declaration[id];
    return {
      person: d.personCardId ? label(state.cards[d.personCardId]) : null,
      item: d.itemCardId ? label(state.cards[d.itemCardId]) : null,
      identity: d.identity,
      fight: d.fight,
    };
  };
  pushEvent(state, {
    type: 'battle-reveal',
    scope: 'all',
    text: `同时亮牌：A 出战 [${combo('A').person}${combo('A').item ? ' + ' + combo('A').item : ''}]，B 出战 [${combo('B').person}${combo('B').item ? ' + ' + combo('B').item : ''}]`,
    data: { A: combo('A'), B: combo('B') },
  });

  // 1) 贼效果优先结算：弃隐身衣 + 夺取对方出战组合里的武器
  for (const id of ids) {
    const d = state.declaration[id];
    if (!d.itemCardId || !isCloak(state.cards[d.itemCardId])) continue;
    removeFrom(state.battleZone[id], d.itemCardId);
    state.discard.push(d.itemCardId);
    pushEvent(state, { type: 'thief-cloak', scope: 'all', text: `${id} 触发贼效果：弃掉隐身衣`, data: { side: id } });
    const foe = other(id);
    const weapon = state.battleZone[foe].find((cid) => isWeapon(state.cards[cid]));
    if (weapon) {
      removeFrom(state.battleZone[foe], weapon);
      acquire(state, id, weapon);
      pushEvent(state, { type: 'thief-steal', scope: 'all', text: `${id} 夺取 ${foe} 出战组合中的武器`, data: { side: id, from: foe, stolen: true } });
    } else {
      pushEvent(state, { type: 'thief-steal', scope: 'all', text: `${id} 的贼效果未夺取到武器（对手出战组合无武器）`, data: { side: id, from: foe, stolen: false } });
    }
  }

  const ia = state.declaration.A.identity;
  const ib = state.declaration.B.identity;
  const cmp = compareIdentity(ia, ib);

  if (cmp === 'draw') {
    const how = RULES.drawDiscardsBattleCards ? '双方出战卡牌全部进弃牌堆' : '双方出战卡牌全部返还';
    pushEvent(state, { type: 'battle-draw', scope: 'all', text: `身份判定：A = ${ia}，B = ${ib} → 无克制关系，平局；${how}`, data: { ia, ib } });
    for (const id of ids) {
      if (RULES.drawDiscardsBattleCards) discardBattleCards(state, id);
      else returnBattleCards(state, id);
    }
    checkZeroHands(state);
    state.phase = 'end';
    return;
  }

  state.decisiveThisRound += 1;
  const winner = cmp === 'a' ? 'A' : 'B';
  const loser = other(winner);
  pushEvent(state, { type: 'battle-win', scope: 'all', text: `身份判定：A = ${ia}，B = ${ib} → ${winner} 胜出`, data: { ia, ib, winner } });
  state.pending = { kind: 'battle-reward', winner, loser };
}

function projectTakeHand(state, winner, loser) {
  const hand = state.players[winner].hand.slice();
  let hasCrown = hand.some((id) => isCrown(state.cards[id]));
  for (const cid of state.battleZone[loser]) {
    if (isCrown(state.cards[cid]) && hasCrown) continue;
    if (isCrown(state.cards[cid])) hasCrown = true;
    hand.push(cid);
  }
  return hand;
}

function applyReward(state, winner, option) {
  const loser = other(winner);
  if (option === 'take') {
    if (projectTakeHand(state, winner, loser).length === 0) {
      throw new Error('禁止选择会导致自己手牌归零的处理方式');
    }
    for (const cid of state.battleZone[winner].slice()) {
      removeFrom(state.battleZone[winner], cid);
      state.discard.push(cid);
    }
    for (const cid of state.battleZone[loser].slice()) {
      removeFrom(state.battleZone[loser], cid);
      acquire(state, winner, cid);
    }
    pushEvent(state, { type: 'reward', scope: 'private', player: winner, text: '你选择了②：弃掉自己的出战卡牌，收入对手的出战卡牌', data: { option: 'take' } });
  } else {
    returnBattleCards(state, winner);
    for (const cid of state.battleZone[loser].slice()) {
      removeFrom(state.battleZone[loser], cid);
      state.discard.push(cid);
    }
    pushEvent(state, { type: 'reward', scope: 'private', player: winner, text: '你选择了①：保留自己的出战卡牌，对手出战卡牌送入弃牌堆', data: { option: 'keep' } });
  }
  // 败者只能看到卡牌最终变化结果，看不到胜者选了哪个选项
  pushEvent(state, { type: 'battle-settled', scope: 'all', text: '战斗结算完成' });
  checkZeroHands(state);
}

function phaseEnd(state) {
  state.berserk = { A: false, B: false };
  state.declaration = null;
  state.battleZone = { A: [], B: [] };
  state.players.A.seenThisTurn = [];
  state.players.B.seenThisTurn = [];
  if (!state.turnZhiGePlayed) state.atWarCounter = 0;
  state.turnZhiGePlayed = false;

  const endOfRound = state.turn === 'B';
  if (endOfRound) {
    if (state.deck.length === 0) {
      state.stalemateRounds = state.decisiveThisRound === 0 ? state.stalemateRounds + 1 : 0;
    }
    state.decisiveThisRound = 0;
    state.round += 1;
  }

  if (state.deck.length === 0 && state.atWarCounter >= RULES.zhiGeGoal) {
    return endByHands(state, '止戈计数达成且主牌堆已空');
  }
  if (state.deck.length === 0 && state.stalemateRounds >= RULES.stalemateRounds) {
    return endByHands(state, `主牌堆耗尽后连续 ${RULES.stalemateRounds} 个完整回合未产生战斗胜负`);
  }
  if (endOfRound && state.round > RULES.maxRounds) {
    return endByHands(state, `达到全局回合上限 ${RULES.maxRounds}`);
  }

  state.turn = other(state.turn);
  state.turnIndex += 1;
  state.phase = 'draw';
}

// ---------------------------------------------------------------- 功能牌

function playFunction(state, playerId, pick) {
  const cardId = pick.cardId;
  const hand = state.players[playerId].hand;
  if (!hand.includes(cardId)) return false; // 已被别的效果移走，视为空过
  const card = state.cards[cardId];
  const foe = other(playerId);
  removeFrom(hand, cardId);
  state.discard.push(cardId);
  pushEvent(state, { type: 'play-function', scope: 'all', text: `${playerId} 打出功能牌【${card.name}】`, data: { player: playerId, name: card.name } });

  let zhiGe = false;
  switch (card.name) {
    case '洞若观火': {
      const pool = state.players[foe].hand;
      if (pool.length === 0) break;
      const seenId = pool[randInt(state, pool.length)];
      state.players[playerId].seenThisTurn.push(seenId);
      pushEvent(state, { type: 'peek', scope: 'private', player: playerId, text: `你探查到对手手牌中的 1 张：${label(state.cards[seenId])}（本回合内可回看）`, data: { seenId } });
      break;
    }
    case '重整': {
      const persons = state.deck.filter((id) => isPerson(state.cards[id]));
      if (persons.length === 0) break;
      const got = persons[randInt(state, persons.length)];
      removeFrom(state.deck, got);
      acquire(state, playerId, got);
      pushEvent(state, { type: 'regroup', scope: 'private', player: playerId, text: `重整：从主牌堆抽到 ${label(state.cards[got])} 加入手牌`, data: { gotId: got } });
      break;
    }
    case '颠倒是非': {
      const pool = state.players[foe].hand.filter((id) => isPerson(state.cards[id]));
      if (pool.length === 0) break;
      const target = state.cards[pool[randInt(state, pool.length)]];
      target.align = target.align === '善' ? '恶' : '善';
      break;
    }
    case '铸剑为犁': {
      const pool = state.players[foe].hand.filter((id) => isWeapon(state.cards[id]));
      if (pool.length === 0) break;
      const target = pool[randInt(state, pool.length)];
      removeFrom(state.players[foe].hand, target);
      state.discard.push(target);
      break;
    }
    case '推心置腹': {
      const giveId = pick.giveCardId;
      const myPool = hand.filter((id) => !isFunctionCard(state.cards[id]));
      const foePool = state.players[foe].hand.filter((id) => !isFunctionCard(state.cards[id]));
      if (!giveId || !myPool.includes(giveId) || foePool.length === 0) break;
      const takeId = foePool[randInt(state, foePool.length)];
      removeFrom(hand, giveId);
      removeFrom(state.players[foe].hand, takeId);
      const giveRes = acquire(state, foe, giveId);
      const takeRes = acquire(state, playerId, takeId);
      pushEvent(state, {
        type: 'swap',
        scope: 'all',
        text: `推心置腹：${playerId} 交出 ${label(state.cards[giveId])}，换得 ${label(state.cards[takeId])}`
          + (giveRes.overflow || takeRes.overflow ? '（其中一张因皇冠上限溢出弃置）' : ''),
        data: { player: playerId, giveId, takeId },
      });
      break;
    }
    case '沉默': {
      state.players[foe].silenced = true;
      pushEvent(state, { type: 'silence', scope: 'private', player: playerId, text: '沉默施加成功：对手下一回合无法打出功能牌' });
      break;
    }
    case '止戈': {
      state.atWarCounter = Math.min(RULES.zhiGeGoal, state.atWarCounter + 1);
      state.turnZhiGePlayed = true;
      pushEvent(state, { type: 'zhige', scope: 'all', text: `${playerId} 打出止戈：跳过背水一战判定、对抗宣告与战斗结算（止戈计数 ${state.atWarCounter}）`, data: { player: playerId } });
      zhiGe = true; // 止戈：本阶段结算完直接跳到回合结束
      break;
    }
    default:
      throw new Error(`未实现的功能牌：${card.name}`);
  }
  if (!zhiGe) complete(state);
  checkZeroHands(state);
  return zhiGe;
}

// 收到某个座位的能力牌提交；两边都交完才结算
function submitFunction(state, p, command) {
  const playerId = command.playerId;
  if (playerId !== 'A' && playerId !== 'B') throw new Error('玩家必须是 A 或 B');
  if (p.submitted.includes(playerId)) throw new Error(playerId + ' 已提交本回合能力牌，不可修改');
  if (command.type === 'PLAY_FUNCTION') {
    checkFunctionPick(state, playerId, command);
    p.picks[playerId] = { cardId: command.cardId, giveCardId: command.giveCardId ?? null };
  } else if (command.type === 'PASS_FUNCTION') {
    p.picks[playerId] = null;
  } else {
    throw new Error('当前需要 PLAY_FUNCTION 或 PASS_FUNCTION');
  }
  p.submitted.push(playerId);
  pushEvent(state, { type: 'function-locked', scope: 'all', text: playerId + ' 已提交本回合能力牌（同时暗置，全部提交后依次结算）' });
  if (p.submitted.length < 2) return;
  state.pending = null;
  resolveFunctionPhase(state, p);
}

// 提交时就校验，别等到结算才发现这张牌根本打不出来
function checkFunctionPick(state, playerId, command) {
  const hand = state.players[playerId].hand;
  const cardId = command.cardId;
  if (!cardId || !hand.includes(cardId) || !isFunctionCard(state.cards[cardId])) {
    throw new Error('打出的必须是手牌中的功能牌');
  }
  if (state.cards[cardId].name === '推心置腹') {
    // 拿不出非功能牌（或指了张功能牌）不算非法提交：交换自然失败，公开只提示"结算完成"
    const pool = hand.filter((id) => id !== cardId && !isFunctionCard(state.cards[id]));
    if (command.giveCardId && !pool.includes(command.giveCardId)) command.giveCardId = null;
  }
}

function resolveFunctionPhase(state, p) {
  let zhiGe = false;
  for (const seat of ['A', 'B']) {
    if (state.winner) break;
    const pick = p.picks[seat] ?? null;
    if (!pick) {
      pushEvent(state, { type: 'pass-function', scope: 'all', text: seat + ' 不打出功能牌' });
      continue;
    }
    if (playFunction(state, seat, pick)) zhiGe = true;
  }
  state.phase = (zhiGe || state.winner) ? 'end' : 'berserk';
}

// ---------------------------------------------------------------- 指令入口
function apply(state, command) {
  if (state.winner) throw new Error('游戏已结束，无法继续操作');
  const p = state.pending;
  if (!p) {
    advance(state);
    return state;
  }
  switch (p.kind) {
    case 'function-phase': {
      submitFunction(state, p, command);
      break;
    }
    case 'declare-phase': {
      if (command.type !== 'DECLARE') throw new Error('当前需要 DECLARE 宣告');
      declare(state, p, command);
      break;
    }
    case 'battle-reward': {
      if (command.type !== 'CHOOSE_REWARD') throw new Error('当前需要 CHOOSE_REWARD');
      if (command.playerId !== p.winner) throw new Error('只有胜者可以选择处理方式');
      if (command.option !== 'keep' && command.option !== 'take') throw new Error('option 必须是 keep 或 take');
      state.pending = null;
      applyReward(state, p.winner, command.option);
      if (!state.winner) state.phase = 'end';
      break;
    }
    default:
      throw new Error(`未知 pending: ${p.kind}`);
  }
  advance(state);
  return state;
}

function declare(state, p, command) {
  const playerId = command.playerId;
  if (playerId !== 'A' && playerId !== 'B') throw new Error('玩家必须是 A 或 B');
  if (p.submitted.includes(playerId)) throw new Error(`${playerId} 已锁定宣告，不可修改`);
  const hand = state.players[playerId].hand;
  let decl;
  if (command.fight !== true) {
    decl = { fight: false, personCardId: null, itemCardId: null, identity: null };
  } else {
    const personCardId = command.personCardId;
    if (!personCardId || !hand.includes(personCardId) || !isPerson(state.cards[personCardId])) {
      throw new Error('出战组合必须包含一张自己手牌中的人牌');
    }
    const itemCardId = command.itemCardId ?? null;
    if (itemCardId && (!hand.includes(itemCardId) || !isItem(state.cards[itemCardId]))) {
      throw new Error('出战组合至多搭配一张自己手牌中的道具牌');
    }
    const identity = identityOf(
      { person: state.cards[personCardId], item: itemCardId ? state.cards[itemCardId] : null },
      state.berserk[playerId],
    );
    decl = { fight: true, personCardId, itemCardId, identity };
    removeFrom(hand, personCardId);
    state.battleZone[playerId].push(personCardId);
    if (itemCardId) {
      removeFrom(hand, itemCardId);
      state.battleZone[playerId].push(itemCardId);
    }
  }
  state.declaration[playerId] = decl;
  p.submitted.push(playerId);
  pushEvent(state, { type: 'declare-locked', scope: 'all', text: `${playerId} 已提交并锁定本回合宣告` });
  if (p.submitted.length === 2) {
    state.pending = null;
    state.phase = 'battle';
  }
}

// 仅用于自动对局 / 不变式测试的随机策略机器人，使用独立随机源，不污染牌堆随机数。
function mulberry(seed) {
  let s = seed >>> 0 || 1;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeBot(seed, opts = {}) {
  const rnd = mulberry(seed);
  const fightChance = opts.fightChance ?? 0.65;
  return {
    next(state, playerId) {
      const p = state.pending;
      if (!p) return null;
      if (p.kind === 'function-phase') {
        if (p.submitted.includes(playerId)) return null;
        const playable = state.players[playerId].hand.filter((id) => isFunctionCard(state.cards[id]));
        if (!playable.length || rnd() < 0.25) return { type: 'PASS_FUNCTION', playerId };
        const cardId = playable[Math.floor(rnd() * playable.length)];
        const cmd = { type: 'PLAY_FUNCTION', playerId, cardId };
        if (state.cards[cardId].name === '推心置腹') {
          const mine = state.players[playerId].hand.filter((id) => id !== cardId && !isFunctionCard(state.cards[id]));
          if (mine.length) cmd.giveCardId = mine[Math.floor(rnd() * mine.length)];
        }
        return cmd;
      }
      if (p.kind === 'declare-phase') {
        if (p.submitted.includes(playerId)) return null;
        const persons = state.players[playerId].hand.filter((id) => isPerson(state.cards[id]));
        if (!persons.length || rnd() > fightChance) return { type: 'DECLARE', playerId, fight: false };
        const personCardId = persons[Math.floor(rnd() * persons.length)];
        const items = state.players[playerId].hand.filter((id) => isItem(state.cards[id]));
        const cmd = { type: 'DECLARE', playerId, fight: true, personCardId };
        if (items.length && rnd() < 0.5) cmd.itemCardId = items[Math.floor(rnd() * items.length)];
        return cmd;
      }
      if (p.kind === 'battle-reward') {
        if (p.winner !== playerId) return null;
        return { type: 'CHOOSE_REWARD', playerId, option: rnd() < 0.5 ? 'keep' : 'take' };
      }
      return null;
    },
  };
}

// 驱动一局自动对局，返回最终 state。
function autoplay(state, seed = 7, opts = {}) {
  const bots = { A: makeBot(seed * 2 + 1, opts), B: makeBot(seed * 2 + 2, opts) };
  let guard = 0;
  while (!state.winner) {
    if (++guard > 20000) throw new Error('autoplay 无法结束');
    const p = state.pending;
    if (!p) { throw new Error('autoplay: 没有待处理指令却未结束'); }
    const actor = p.kind === 'function-phase' ? (p.submitted.includes('A') ? 'B' : 'A')
      : p.kind === 'declare-phase' ? (p.submitted.includes('A') ? 'B' : 'A')
      : p.winner;
    const cmd = bots[actor].next(state, actor);
    if (!cmd) throw new Error(`bot 无法为 ${actor} 生成指令 (${p.kind})`);
    try {
      applySafe(state, cmd);
    } catch (err) {
      if (cmd.type === 'CHOOSE_REWARD' && cmd.option === 'take') {
        applySafe(state, { ...cmd, option: 'keep' });
      } else {
        throw err;
      }
    }
  }
  return state;
}

function applySafe(state, cmd) {
  return apply(state, cmd);
}

/* ===== src/room.js ===== */
// 房间服务（联机对战）：只有服务器持有完整 state，客户端各拿自己那份 redact + view。
//
// 传输层不在这里：本模块只做「房间/座位/令牌/指令校验/快照」，
// HTTP + SSE 的接线在 server.mjs，浏览器端的会话适配在 web/remote.js。
// 浏览器里房主也要跑同一份房间逻辑（免后端联机），所以不依赖 node:crypto：
// Node >= 19 和所有现代浏览器都有 globalThis.crypto（Web Crypto）。
const webCrypto = globalThis.crypto;
const randomUUID = () => webCrypto.randomUUID();
const randomToken = () => Array.from(webCrypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, '0')).join('');




// 去掉容易看错的 I O 0 1，邀请码只念不写错
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const CODE_LEN = 4;
const IDLE_MS = 6 * 60 * 60 * 1000; // 6 小时没人动就回收

const roomMirror = (id) => (id === 'A' ? 'B' : 'A');

function makeCode() {
  let s = '';
  for (let i = 0; i < CODE_LEN; i++) s += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
  return s;
}

// 该座位此刻是否被允许提交指令（apply() 不校验身份，必须在这里挡住）
function canAct(state, seat) {
  const p = state.pending;
  if (!p || state.winner) return false;
  if (p.kind === 'function-phase') return !p.submitted.includes(seat);
  if (p.kind === 'declare-phase') return !p.submitted.includes(seat);
  if (p.kind === 'battle-reward') return p.winner === seat;
  return false;
}
function createHub() {
  const rooms = new Map();

  const sweep = () => {
    const now = Date.now();
    for (const [code, room] of rooms) {
      if (now - room.touched > IDLE_MS && room.listeners.A.size === 0 && room.listeners.B.size === 0) rooms.delete(code);
    }
  };

  const newGame = (seed) => createGame(seed ?? Math.floor(Math.random() * 900000000) + 1000000);

  const findRoom = (code) => rooms.get(String(code ?? '').toUpperCase().trim()) ?? null;

  function open(code, seat) {
    const room = findRoom(code);
    if (!room) return null;
    const token = randomToken();
    room.seats[seat] = { token, joinedAt: Date.now() };
    room.touched = Date.now();
    return { code: room.code, seat, token };
  }

  return {
    create() {
      sweep();
      let code = makeCode();
      while (rooms.has(code)) code = makeCode();
      const state = newGame();
      const room = {
        code,
        gameId: randomUUID(),
        state,
        seats: { A: null, B: null },
        listeners: { A: new Set(), B: new Set() },
        touched: Date.now(),
      };
      rooms.set(code, room);
      return open(code, 'A');
    },

    join(code) {
      const room = findRoom(code);
      if (!room) return { error: 'room-not-found' };
      if (room.seats.B?.token) return { error: 'room-full' };
      if (room.seats.B) return open(room.code, 'B');
      return open(room.code, 'B');
    },

    auth(code, token) {
      const room = findRoom(code);
      if (!room || !token) return null;
      for (const seat of ['A', 'B']) {
        if (room.seats[seat]?.token === token) return { room, seat };
      }
      return null;
    },

    has(code) { return Boolean(findRoom(code)); },

    // 客户端用：把自己这份快照发出去（state 已脱敏）
    snapshot(room, seat) {
      const view = viewFor(room.state, seat);
      // publicLog / privateLog 是给界面看的纯文本，里面会带「种子 12345」，这里统一抹掉
      const scrub = (list) => (Array.isArray(list) ? list.map(stripSeed) : list);
      return {
        code: room.code,
        gameId: room.gameId,
        seq: room.state.seq,
        you: seat,
        over: Boolean(room.state.winner),
        seats: { A: Boolean(room.seats.A), B: Boolean(room.seats.B) },
        state: redactState(room.state, seat),
        view: { ...view, publicLog: scrub(view.publicLog), privateLog: scrub(view.privateLog) },
        events: visibleEventsFor(room.state, seat),
      };
    },

    act(room, seat, cmd) {
      if (!cmd || typeof cmd !== 'object') return { error: 'bad-command' };
      if (!canAct(room.state, seat)) return { error: 'not-your-turn' };
      // 客户端不许替别人提交
      if (cmd.playerId && cmd.playerId !== seat) return { error: 'not-your-seat' };
      room.touched = Date.now();
      // 双方同时提交时会有「快照还没到、指令已经过时」的竞态（比如能力牌阶段刚结束，
      // 另一条 PLAY_FUNCTION 才到）。这属于正常对局流程，不该是服务器错误：
      // 统一回 { error: 'rejected', message }，服务器记一条日志。
      try {
        apply(room.state, { ...cmd, playerId: seat });
      } catch (err) {
        console.warn('[room] 指令被拒:', seat, cmd.type, err.message);
        return { error: 'rejected', message: err.message };
      }
      return { ok: true, seq: room.state.seq };
    },

    rematch(room) {
      room.state = newGame();
      room.gameId = randomUUID();
      room.touched = Date.now();
      return { ok: true, gameId: room.gameId };
    },

    on(code, seat, fn) {
      const room = findRoom(code);
      if (!room) return () => {};
      room.listeners[seat].add(fn);
      return () => room.listeners[seat].delete(fn);
    },

    // 有变化就推给房间里两个座位（各自脱敏）
    publish(room) {
      if (!room) return;
      for (const seat of ['A', 'B']) {
        for (const fn of [...room.listeners[seat]]) {
          try { fn(this.snapshot(room, seat)); }
          catch { room.listeners[seat].delete(fn); } // 这个通道断了，别连累另一家
        }
      }
    },

    count() { return rooms.size; },
  };
}

/* ===== web/session.js ===== */




// 界面无关的对局会话：谁该行动、谁能看到什么、机器人怎么走。
// 与 DOM 分离，浏览器和 Node 测试共用同一份。（other() 直接复用 engine.js 的实现）
function createSession({ seed = 1, mode = 'ai', botSeed = 7, fightChance = 0.65 } = {}) {
  const state = createGame(seed);
  const bot = makeBot(botSeed, { fightChance });
  return {
    state,
    mode,
    seed,
    isBot(playerId) {
      if (mode === 'demo') return true;
      return mode === 'ai' && playerId === 'B';
    },
    view(playerId) {
      return viewFor(state, playerId);
    },
    act(playerId, command) {
      // 指令统一带上「谁在操作」，引擎不用从 pending 里猜
      apply(state, { playerId, ...command });
      return state;
    },
    // 当前必须由谁提交指令；无人待办（终局）返回 null
    actor() {
      const p = state.pending;
      if (state.winner || !p) return null;
      // 能力牌 / 宣告都是双方同时暗置：由当前回合玩家先提交，再轮到对手
      if (p.kind === 'function-phase' || p.kind === 'declare-phase') {
        return p.submitted.includes(state.turn) ? other(state.turn) : state.turn;
      }
      if (p.kind === 'battle-reward') return p.winner;
      return null;
    },
    waitingFor() {
      const p = state.pending;
      if (p?.kind !== 'function-phase' && p?.kind !== 'declare-phase') return null;
      return p.submitted.includes(state.turn) ? other(state.turn) : state.turn;
    },
    botCommand(playerId) {
      return bot.next(state, playerId);
    },
    eventsSince(seq) {
      return state.events.filter((e) => e.seq > seq);
    },
  };
}

﻿// 联机后端地址解析：让「静态前端」和「联机后端」可以分开部署。
//
// 部署方式（静态前端 Cloudflare Pages + 独立后端 Railway / Render / Fly）：
//   把下面 DEFAULT_SERVER 改成你的后端地址，然后重新打包（node tools/build-site.mjs）。
//   留空 = 同源：用 `node server.mjs` 本地起、或前后端一起部署在同一台机器时用这个。
//
// 也可以不改代码，直接在界面上填：
//   优先级 = 地址栏 ?server= > 玩家在本机存过的地址 > DEFAULT_SERVER > 同源
const DEFAULT_SERVER = '';

// 允许玩家直接粘 `wss://xxx.up.railway.app` 这种写法，统一成 http(s)
function normalizeServer(v) {
  let s = String(v ?? '').trim();
  if (!s) return '';
  s = s.replace(/\/+$/, '');
  if (/^wss:\/\//i.test(s)) s = 'https://' + s.slice(6);
  else if (/^ws:\/\//i.test(s)) s = 'http://' + s.slice(5);
  else if (!/^https?:\/\//i.test(s)) s = 'https://' + s.replace(/^\/+/, '');
  return s;
}

function fromQuery() {
  try {
    if (typeof location === 'undefined' || !location.search) return '';
    const raw = new URLSearchParams(location.search).get('server');
    return raw ? normalizeServer(raw) : '';
  } catch { return ''; }
}

function fromStorage() {
  try { return normalizeServer(globalThis.localStorage?.getItem('rt-server')); } catch { return ''; }
}

function fromConfig() {
  try { return normalizeServer(globalThis.RT_SERVER || DEFAULT_SERVER); } catch { return ''; }
}

// 联机后端根地址；'' 表示「跟当前网页同一个域名」
function serverOrigin() {
  return fromQuery() || fromStorage() || fromConfig();
}

// 把 /api/xxx 补成完整的后端地址（同源时原样返回，本地开发零改动）
function apiUrl(path) {
  const origin = serverOrigin();
  return origin ? origin + path : path;
}
function saveServerOrigin(v) {
  try { globalThis.localStorage?.setItem('rt-server', normalizeServer(v)); } catch { /* 隐私模式忽略 */ }
}

// 免后端联机：两名玩家通过公共 MQTT 中继互相转发消息，房主浏览器里跑权威引擎。
//
// 为什么要有它：静态托管的网页（Cloudflare Pages / CodeSandbox / 直接发 HTML）没有后端，
// 单机能玩，双人就开不了局。这里补上：
//   · 房主建房：房主浏览器里跑 src/room.js 里那套一模一样的房间内核（发牌、脱敏、判负都在同一份代码里），
//     只把「各自脱敏」的快照分别发出去，所以对手的手牌、牌堆、背水一战一样看不到。
//   · 客机加入：把自己的指令发到 up 主题，等房主把属于自己座位的快照推回来。
//   · 中继用公开 MQTT broker（EMQX / Mosquitto 公共测试服），不用注册、不用自己开服务器。
//
// 主题（royal-thief/v1/<邀请码>/…）：
//   up    客机 → 房主：{t:'join'} / {t:'act',cmd} / {t:'rematch'} / {t:'ping'}
//   a     房主 → 座位 A：脱敏快照
//   b     房主 → 座位 B：脱敏快照
//   ctrl  房主 → 客机：{t:'joined',seat} / {t:'full'} / {t:'rejected',error} / {t:'pong'}
//
// 安全边界：邀请码就是房间钥匙——知道邀请码的人能拿到「自己那份」快照、能提交自己的指令。
// 朋友之间开局够用；要更严格的身份校验就用自建后端（server.mjs + 界面里填服务器地址）。


const NS = 'royal-thief/v1';

// 公共中继，按顺序尝试：前面连不上就换下一个
const RELAY_BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://test.mosquitto.org:8081/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
];

const mirrorOf = (id) => (id === 'A' ? 'B' : 'A');

// 还没拿到第一帧快照时先渲染这个空壳，结构跟真状态一模一样
const emptyState = () => ({
  cards: {}, deck: [], discard: [],
  players: { A: { hand: [], silenced: false }, B: { hand: [], silenced: false } },
  turn: 'A', round: 1, phase: 'draw', atWarCounter: 0, berserk: { A: false, B: false },
  pending: null, winner: null, events: [], seq: 0,
});

// 中继客户端按需加载：单机完全不碰它，只有联机时才拉 mqtt.js（先本地再 CDN）
let mqttLoading = null;
function loadRelayLib() {
  if (globalThis.mqtt?.connect) return Promise.resolve(globalThis.mqtt);
  if (mqttLoading) return mqttLoading;
  mqttLoading = new Promise((resolve, reject) => {
    if (typeof document === 'undefined') { reject(new Error('no-dom')); return; }
    const srcs = ['vendor/mqtt.min.js', 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js'];
    const next = (i) => {
      if (i >= srcs.length) { reject(new Error('中继库加载失败')); return; }
      const tag = document.createElement('script');
      tag.src = srcs[i];
      tag.onload = () => (globalThis.mqtt?.connect ? resolve(globalThis.mqtt) : next(i + 1));
      tag.onerror = () => { tag.remove(); next(i + 1); };
      document.head.appendChild(tag);
    };
    next(0);
  });
  return mqttLoading;
}

// 接上中继：返回 { send(频道, 对象), close() }
async function openRelay({ code, role, onMessage, onStatus }) {
  const mqtt = await loadRelayLib();
  const base = NS + '/' + String(code ?? '').toUpperCase();
  const subs = role === 'host' ? [base + '/up'] : [base + '/b', base + '/ctrl'];
  let lastErr = null;
  for (const url of RELAY_BROKERS) {
    try {
      const client = await new Promise((resolve, reject) => {
        const c = mqtt.connect(url, {
          clientId: 'rt-' + Math.random().toString(16).slice(2, 12),
          connectTimeout: 9000,
          reconnectPeriod: 3000,
          clean: true,
        });
        const fail = (err) => { try { c.end(true); } catch { /* 忽略 */ } reject(err ?? new Error('connect-failed')); };
        const timer = setTimeout(() => fail(new Error('connect-timeout')), 12000);
        c.once('connect', () => { clearTimeout(timer); resolve(c); });
        c.once('error', (err) => { clearTimeout(timer); fail(err); });
      });
      await new Promise((res, rej) => client.subscribe(subs, { qos: 0 }, (err) => (err ? rej(err) : res())));
      client.on('message', (topic, payload) => {
        let msg = null;
        try { msg = JSON.parse(payload.toString()); } catch { return; }
        onMessage?.(topic, msg);
      });
      client.on('close', () => onStatus?.('reconnecting'));
      return {
        url,
        send(channel, obj) { client.publish(base + '/' + channel, JSON.stringify(obj), { qos: 0 }); },
        close() { try { client.end(true); } catch { /* 忽略 */ } },
      };
    } catch (err) { lastErr = err; }
  }
  throw lastErr ?? new Error('relay-unreachable');
}

function baseSession({ code, seat, token = '' }) {
  return {
    mode: 'online', relay: true, code, token, seat, seed: code,
    gameId: null, ready: false, status: 'connecting', link: null, joinTimer: null, closed: false,
    state: emptyState(), viewCache: null, queue: [], trace: [], lastAt: 0, onSnapshot: null,

    note(src, snap) {
      this.lastAt = Date.now();
      this.trace.push({ src, seq: snap?.seq ?? null, kind: snap?.state?.pending?.kind ?? '-', w: snap?.state?.winner ?? null });
      if (this.trace.length > 80) this.trace.shift();
    },
    apply(snap, src) {
      if (!snap?.state) return;
      if (this.joinTimer) { clearInterval(this.joinTimer); this.joinTimer = null; }
      this.note(src, snap);
      this.seat = snap.you ?? this.seat;
      // 先把快照交给界面：它要靠「旧 state 的 seq」判新旧、靠 gameId 判是不是新开的一局，
      // 所以 state / viewCache / queue / gameId 都必须等它读完再覆盖（和 remote.js 的时序一致）。
      this.onSnapshot?.(snap, 'relay');
      this.gameId = snap.gameId ?? this.gameId;
      this.viewCache = snap.view;
      this.queue = snap.events ?? [];
      this.state = snap.state;
      this.ready = true;
    },
    isBot() { return false; },
    view() { return this.viewCache; },
    botCommand() { return null; },
    eventsSince(seq) { return this.queue.filter((e) => e.seq > seq); },
    actor() {
      const st = this.state;
      if (!st || st.winner || !st.pending) return null;
      return this.seat;
    },
    waitingFor() {
      const p = this.state?.pending;
      if (p?.kind !== 'declare-phase' && p?.kind !== 'function-phase') return null;
      return p.submitted.includes(this.seat) ? mirrorOf(this.seat) : this.seat;
    },
  };
}

// 房主：本地跑权威引擎，把两边各自的脱敏快照分别推出去
function createRelayHostSession({ onSnapshot, onStatus, openLink } = {}) {
  const hub = createHub();
  const me = hub.create();
  const S = baseSession({ code: me.code, seat: 'A', token: me.token });
  S.onSnapshot = onSnapshot;
  const room = hub.auth(me.code, me.token).room;

  // A 的快照留在本地渲染；B 的快照原样转发到 b 主题（脱敏在 hub 里已经做过了）
  hub.on(me.code, 'A', (snap) => S.apply(snap, 'relay'));
  hub.on(me.code, 'B', (snap) => S.link?.send('b', snap));

  const publish = () => hub.publish(room);

  const onUp = (_topic, msg) => {
    if (S.closed || !msg || typeof msg !== 'object') return;
    if (msg.t === 'join') {
      const out = hub.join(me.code);
      if (out.error) { S.link?.send('ctrl', { t: 'full' }); return; }
      S.link?.send('ctrl', { t: 'joined', seat: out.seat, code: me.code });
      S.link?.send('b', hub.snapshot(room, out.seat));
      publish();
      return;
    }
    if (msg.t === 'act') {
      const out = hub.act(room, 'B', msg.cmd);
      if (out.error) S.link?.send('ctrl', { t: 'rejected', error: out.error });
      else publish();
      return;
    }
    if (msg.t === 'rematch') { S.rematch(); return; }
    if (msg.t === 'ping') { S.link?.send('ctrl', { t: 'pong' }); }
  };

  S.act = function (_playerId, cmd) {
    const out = hub.act(room, 'A', cmd);
    if (out.error) onStatus?.('rejected', out.error);
    else publish();
  };
  S.rematch = function () { hub.rematch(room); publish(); return true; };

  S.connect = function () {
    publish(); // 先让自己这张牌桌亮起来，客人什么时候来都不影响
    (openLink ?? openRelay)({ code: me.code, role: 'host', onMessage: onUp, onStatus })
      .then((link) => { S.link = link; S.status = 'online'; onStatus?.('online'); publish(); })
      .catch(() => { S.status = 'offline'; onStatus?.('offline'); });
  };
  S.close = function () { S.closed = true; if (S.link) { S.link.close(); S.link = null; } };
  return S;
}

// 客机：自己不算牌，只把指令发上去、把属于自己座位的快照渲染出来
function createRelayGuestSession({ code, onSnapshot, onStatus, openLink } = {}) {
  const S = baseSession({ code: String(code ?? '').toUpperCase(), seat: 'B' });
  S.onSnapshot = onSnapshot;

  const onDown = (topic, msg) => {
    if (S.closed) return;
    if (String(topic).endsWith('/ctrl')) {
      if (msg.t === 'full') onStatus?.('rejected', 'room-full');
      else if (msg.t === 'joined') { S.seat = msg.seat ?? S.seat; S.status = 'online'; onStatus?.('online'); }
      else if (msg.t === 'rejected') onStatus?.('rejected', msg.error);
      return;
    }
    S.apply(msg, 'relay');
  };

  const say = (obj) => S.link?.send('up', obj);

  S.act = function (_playerId, cmd) { say({ t: 'act', cmd }); };
  S.rematch = function () { say({ t: 'rematch' }); return true; };

  S.connect = function () {
    (openLink ?? openRelay)({ code: S.code, role: 'guest', onMessage: onDown, onStatus })
      .then((link) => {
        S.link = link;
        S.status = 'online';
        onStatus?.('online');
        say({ t: 'join' });
        // 房主可能刚开房还没接上中继，隔几秒补喊一次，直到拿到第一帧
        S.joinTimer = setInterval(() => { if (!S.ready) say({ t: 'join' }); }, 2500);
        setTimeout(() => { if (!S.ready) onStatus?.('waiting-host'); }, 9000);
      })
      .catch(() => { S.status = 'offline'; onStatus?.('offline'); });
  };
  S.close = function () {
    S.closed = true;
    if (S.joinTimer) { clearInterval(S.joinTimer); S.joinTimer = null; }
    if (S.link) { S.link.close(); S.link = null; }
  };
  return S;
}

/* ===== web/remote.js ===== */
// 联机会话适配器：把 web/app.js 需要的 ui.s 契约（和 session.js 一模一样）接到房间服务器上。
//
// 与本地 session.js 的区别：
//   · state 是服务器下发的「脱敏状态」，不是真状态；view 也是服务器算好的那一份
//   · act() 不本地执行，而是 POST 给服务器，等服务器把新快照从 SSE 推回来
//   · actor() 一律返回自己的座位：联机是同时暗置宣告，两边都要能操作
//     （具体「该不该由我操作」由 promptHtml 里的 online 分支判断）


const rtRemoteMirror = (id) => (id === 'A' ? 'B' : 'A');
function createRemoteSession({ code, token, seat, onSnapshot, onStatus }) {
  const emptyState = {
    cards: {}, deck: [], discard: [],
    players: { A: { hand: [], silenced: false }, B: { hand: [], silenced: false } },
    turn: 'A', round: 1, phase: 'draw', atWarCounter: 0, berserk: { A: false, B: false },
    pending: null, winner: null, events: [], seq: 0,
  };

  const post = async (path, body) => {
    const res = await fetch(apiUrl(path), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return { ok: res.ok, status: res.status, body: await res.json().catch(() => ({})) };
  };

  const S = {
    mode: 'online',
    code,
    token,
    seat,
    seed: code,
    gameId: null,
    ready: false,
    status: 'connecting',
    state: emptyState,
    viewCache: null,
    queue: [],
    es: null,
    hb: null,
    lastAt: 0,
    trace: [],
    note(src, snap) {
      S.lastAt = Date.now();
      S.trace.push({ src, seq: snap?.seq ?? null, kind: snap?.state?.pending?.kind ?? "-", w: snap?.state?.winner ?? null });
      if (S.trace.length > 80) S.trace.shift();
    },

    // 兜底：只要牌局没结束、还停在某个阶段等人，超过 6 秒没收到任何推送就自己补拉一次。
    // SSE 万一丢了一条，牌桌也能自己恢复，不用刷新页面。
    watchdog() {
      const st = S.state;
      if (!st || st.winner || !st.pending) return;
      if (S.status !== 'online') return;
      if (Date.now() - S.lastAt < 6000) return;
      S.poke();
    },

    isBot() { return false; },
    view() { return S.viewCache; },
    botCommand() { return null; },
    eventsSince(seq) { return S.queue.filter((e) => e.seq > seq); },

    // 联机是「双方同时暗置」，所以只要牌局没结束、还有待办，就当作轮到自己
    actor() {
      const st = S.state;
      const p = st?.pending;
      if (!st || st.winner || !p) return null;
      return seat;
    },
    waitingFor() {
      const p = S.state?.pending;
      if (p?.kind !== 'declare-phase' && p?.kind !== 'function-phase') return null;
      return p.submitted.includes(seat) ? rtRemoteMirror(seat) : seat;
    },

    act(_playerId, cmd) {
      post('/api/room/act', { code, token, cmd })
        .then((r) => {
          // 服务器对「不该你操作 / 指令过时」回 200 + ok:false，不当成故障
          if (!r.ok || r.body?.error) onStatus?.('rejected', r.body?.error);
          else S.poke();
        })
        .catch(() => onStatus?.('offline'));
    },

    async poke() {
      try {
        const r = await fetch(apiUrl(`/api/room/state?code=${encodeURIComponent(code)}&token=${token}`));
        if (!r.ok) { onStatus?.('rejected', 'bad-token'); return; }
        const snap = await r.json();
        S.note('poke', snap);
        onSnapshot?.(snap, 'poke');
      } catch { onStatus?.('offline'); }
    },

    async rematch() {
      const r = await post('/api/room/rematch', { code, token });
      if (!r.ok) onStatus?.('rejected', r.body?.error);
      return r.ok;
    },

    connect() {
      if (typeof EventSource !== 'function') { onStatus?.('no-sse'); return; }
      S.close();
      const es = new EventSource(apiUrl(`/api/room/sse?code=${encodeURIComponent(code)}&token=${token}`));
      S.es = es;
      es.onopen = () => { S.status = 'online'; onStatus?.('online'); S.poke(); };
      es.onmessage = (ev) => {
        try {
          const snap = JSON.parse(ev.data);
          S.status = 'online';
          S.note('sse', snap);
          onSnapshot?.(snap, 'sse');
        } catch { /* 半截数据包就丢掉，等下一条 */ }
      };
      es.onerror = () => { S.status = 'reconnecting'; onStatus?.('reconnecting'); };
      if (!S.hb) S.hb = setInterval(() => S.watchdog(), 3000);
    },

    close() {
      if (S.es) { try { S.es.close(); } catch { /* 忽略 */ } S.es = null; }
      if (S.hb) { clearInterval(S.hb); S.hb = null; }
    },
  };
  return S;
}

/* ---------------- 飞牌动画 ---------------- */
let fxLayer = null;
function fxRoot() {
  if (!ui.fxOn) return null;
  if (typeof document.createElement !== 'function' || !document.body) return null;
  if (!fxLayer || !fxLayer.isConnected) {
    fxLayer = document.createElement('div');

const rectOf = (el) => (el && typeof el.getBoundingClientRect === 'function' ? el.getBoundingClientRect() : null);
const handEl = (who) => $(who === 'A' ? 'handA' : 'handB');

function fly(fromEl, toEl, inner, text) {
  const root = fxRoot();
  if (!root) return;
  const a = rectOf(fromEl);
  const b = rectOf(toEl);
  if (!a || !b || typeof a.left !== 'number') return;
  const box = document.createElement('div');
  box.style.cssText = 'position:absolute;left:0;top:0;width:60px;height:70px;will-change:transform';
  box.innerHTML = inner;
  root.appendChild(box);
  const sx = a.left + a.width / 2 - 30;
  const sy = a.top + a.height / 2 - 35;
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
  const dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  box.style.transform = `translate(${sx}px, ${sy}px)`;
  if (typeof box.animate !== 'function') { box.remove(); return; }
  const anim = box.animate([
    { transform: `translate(${sx}px, ${sy}px) scale(1.08) rotate(-7deg)`, opacity: .95 },
    { transform: `translate(${sx + dx * .55}px, ${sy + dy * .55 - 46}px) scale(1) rotate(5deg)`, opacity: 1, offset: .6 },
    { transform: `translate(${sx + dx}px, ${sy + dy}px) scale(.82) rotate(0deg)`, opacity: .9 },
  ], { duration: 430, easing: 'cubic-bezier(.3,.8,.4,1)' });
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    box.remove();
    if (text) popText(b, text);
  };
  anim.onfinish = finish;
  setTimeout(finish, 700);
}

function popText(r, text) {
  const root = fxRoot();
  if (!root || !r || typeof r.left !== 'number') return;
  const el = document.createElement('div');
  el.className = 'counter';
  el.style.left = `${r.left + r.width / 2 - 18}px`;
  el.style.top = `${r.top - 4}px`;
  el.textContent = text;
  root.appendChild(el);
  if (typeof el.animate !== 'function') { el.remove(); return; }
  const anim = el.animate([
    { opacity: 0, transform: 'translateY(8px)' },
    { opacity: 1, transform: 'none', offset: .25 },
    { opacity: 0, transform: 'translateY(-28px)' },
  ], { duration: 900, easing: 'ease-out' });
  anim.onfinish = () => el.remove();
  setTimeout(() => el.remove(), 1300);
}

      case 'play-function': {
        // 打出的能力牌先在判定区左右两个位置停一下（不要一出就飞走），1.2 秒后再进弃牌堆
        const who = d.player ?? st.turn;
        showFnCard(who, d.name);
        const doFly = () => fly(handEl(who), discard, cardHtml(labelFace(d.name)), `【${d.name}】`);
        if (canAnimate()) setTimeout(doFly, 1900); else doFly();
        break;
      }
      case 'penalty':
        if (d.passer && d.taker) fly(handEl(d.passer), handEl(d.taker), backHtml(), '−1');
        ensureStory().penalties.push({ passer: d.passer, taker: d.taker });
        break;
      case 'penalty-none':
        ensureStory().penalties.push({ none: true, text: e.text });
        break;
      case 'no-penalty':
        ensureStory().penalties.push({ free: true, text: e.text });
        break;
      case 'peek': {
        // 洞若观火：结果只给探查者看，对手那边什么都不显示（信息隐藏条款）
        const mine = ui.mode === 'demo' || e.player === currentViewer();
        if (mine) {
          if (d.seenId) showPeek([d.seenId], '洞若观火 · 你看到对手的 1 张牌');
          else toast('洞若观火：对手手牌为空，无效果');
        }
        break;
      }
      case 'regroup': {
        const mine = ui.mode === 'demo' || e.player === currentViewer();
        if (d.gotId) {
          if (mine) {
            fly(deck, handEl(e.player), cardHtml(faceOf(st.cards[d.gotId])), '重整');
            showPeek([d.gotId], '重整 · 从主牌堆抽到');
          }
        } else if (mine) {
          toast('重整：主牌堆里已经没有人牌，无效果');
        }
        break;
      }
      case 'swap':
        if (d.player && d.giveId && d.takeId) {
          fly(handEl(d.player), handEl(other(d.player)), cardHtml(labelFace(labelOf(st.cards[d.giveId]))), '→');
          fly(handEl(other(d.player)), handEl(d.player), cardHtml(labelFace(labelOf(st.cards[d.takeId]))), '←');
        }
        toast(e.text ?? '交换结算完成');
        break;
      case 'battle-reveal':
        story = { ...blankStory(), reveal: d };
        break;
      case 'thief-cloak':
        if (story) story.cloaks.push(d.side);
        fly($('slot' + d.side), discard, cardHtml(labelFace('隐身衣')), '弃置');
        break;
      case 'thief-steal':
        if (story) story.steals.push(d);
        fly($('slot' + other(d.side)), handEl(d.side), cardHtml(labelFace('武器')), d.stolen ? '夺取' : '无武器');
        toast(e.text ?? '贼效果结算完成');
        break;
      case 'battle-win':
        if (story) story.result = { kind: 'win', winner: d.winner, ia: d.ia, ib: d.ib };
        break;
      case 'battle-draw':
        if (story) story.result = { kind: 'draw', ia: d.ia, ib: d.ib };
        break;
      case 'battle-skipped':
        if (story) story.result = { kind: 'skip' };
        break;
      case 'reward':
        if (d.option) {
          const tgt = story ?? ui.battle?.story;
          if (tgt) tgt.choice = d.option;
        }
        break;
      case 'battle-settled':
        if (story) story.settled = true;
        else if (ui.battle) ui.battle.story.settled = true;
        break;
      case 'crown-overflow':
        fly(handEl(d.player), discard, cardHtml(labelFace('皇冠')), '溢出');
        toast(e.text ?? `${d.player} 皇冠超出上限，直接弃入弃牌堆`);
        break;
      case 'zhige':
        queueBanner('止戈', `${d.player ?? st.turn} 打出止戈，跳过宣告与战斗`);
        toast('此回合止戈生效，跳过宣告与战斗');
        break;
      case 'game-over':
        ui.overBannerPending = true;
        break;
      default:
        break;
    }
  }
  ui.seq = ui.s.state.seq;
  if (story) startBattle(story);
  else if (sawTurnStart && !battleBusy()) ui.battle = null;
  drainGameOverBanner();
}

const labelOf = (card) => (card.kind === 'person' ? `人(${card.align})` : card.name);

function step(fn) {
  // 提交完就换人：清掉遮屏、把「刚操作过的人」记成当前行动者，
  // 这样下一次 actor 变化时才会重新遮屏（否则会出现 A 操作完却还显示「交给 A」）
  if (ui.mode === 'hotseat') {
    ui.lastActor = ui.s?.actor() ?? ui.lastActor;
    ui.gate = null;
  }
  fn();
  // 联机：指令已经发给服务器，等它把新快照推回来再走动画与渲染
  if (ui.mode === 'online') return;
  captureNewEvents();
  render();
}

function pump() {
  if (!ui.s || ui.gate || ui.busy || battleBusy() || ui.s.state.winner) return;
  const actor = ui.s.actor();
  if (!actor || !ui.s.isBot(actor)) return;
  ui.busy = true;
  ui.timer = setTimeout(() => {
    ui.busy = false;
    try {
      if (!ui.s || ui.s.state.winner || ui.gate) return;
      const who = ui.s.actor();
      if (!who || !ui.s.isBot(who)) return;
      const cmd = ui.s.botCommand(who);
      if (cmd) step(() => ui.s.act(who, cmd));
      else render();
    } catch (err) {
      fatal(`机器人行动时出错：${err.message}`, String(err.stack ?? ''));
    }
  }, ui.botDelay ?? (ui.mode === 'demo' ? 820 : 600));
}

function render() {
  if (!ui.s) return;
  const st = ui.s.state;
  const actor = ui.s.actor();
  if (ui.mode === 'hotseat' && !st.winner && actor && ui.gate !== actor && actor !== ui.lastActor) ui.gate = actor;
  const gated = Boolean(ui.gate) && !st.winner;
  if (!gated) renderTable();
  renderStatus();
  renderLog();
  if (st.winner && !battleBusy()) { showGameOver(); return; }
  if (gated) { showGate(ui.gate); return; }
  pump();
}
/* ---------------- 牌桌渲染 ---------------- */
function actorIs(who) {
  return ui.s?.actor() === who;
}

function renderTable() {
  const st = ui.s.state;
  const viewer = currentViewer();
  const god = ui.mode === 'demo';
  const p = st.pending;

  for (const who of ['A', 'B']) {
    const hand = st.players[who].hand;
    const self = god || who === viewer;
    const isActor = actorIs(who);
    const el = handEl(who);
    let html = '';
    if (self) {
      hand.forEach((id, i) => {
        const c = st.cards[id];
        const extra = [];
        // 出牌一律直接点手牌：可点的牌在这里挂上 data-*，提示条只留动作按钮
        const attrs = [`data-card="${id}"`, `style="animation-delay:${i * 40}ms"`];
        if (isActor && p?.kind === 'function-phase' && !p.submitted.includes(who)) {
          if (ui.sel.giveFor) {
            if (c.id === ui.sel.giveFor) extra.push('selected');
            else if (c.kind === 'function') extra.push('dimmed');
            else { extra.push('picking'); attrs.push(`data-give="${id}"`); }
          } else if (c.kind === 'function') {
            extra.push('playable'); attrs.push(`data-play="${id}"`);
          } else extra.push('dimmed');
        } else if (isActor && p?.kind === 'declare-phase' && !p.submitted.includes(who)) {
          if (ui.sel.personId === id || ui.sel.itemId === id) extra.push('selected');
          else if (c.kind === 'person' || c.kind === 'item') extra.push('playable');
          else extra.push('dimmed');
          if (c.kind === 'person') attrs.push(`data-person="${id}"`);
          if (c.kind === 'item') attrs.push(`data-item="${id}"`);
        }
        html += cardHtml(faceOf(c), extra.join(' '), attrs.join(' '));
      });
    } else {
      const shown = hand.length === 0 ? 1 : (RULES.revealHandCounts ? hand.length : 3);
      html = Array.from({ length: shown }, () => backHtml()).join('');
      if (!RULES.revealHandCounts) html += '<span class="stackmany">数量未知</span>';
    }
    el.innerHTML = html;
    const known = god || self || RULES.revealHandCounts;
    el.classList.toggle('empty', self && hand.length === 0);
    // 张数不公开时也不要用「缩略尺寸」间接暴露手牌多少（背面牌会跟着变小）
    el.classList.toggle('compact', known && hand.length > 7);
    el.classList.toggle('tiny', known && hand.length > 11);
    $(who === 'A' ? 'countA' : 'countB').textContent = known ? String(hand.length) : '?';

    const tags = [];
    if (p?.kind === 'declare-phase' && p.submitted.includes(who)) tags.push('<span class="tag act">已锁定宣告</span>');
    if (st.turn === who && !st.winner) tags.push('<span class="tag act">行动中</span>');
    if (self && st.players[who].silenced) tags.push('<span class="tag warn">被沉默</span>');
    if (self && st.berserk[who]) tags.push('<span class="tag warn">背水一战</span>');
    // 本回合窥探过的牌：点一下回看（洞若观火条款允许本回合内回看）
    if (self) {
      const seen = ui.s.view(who).yourSeenThisTurn ?? [];
      if (seen.length) tags.push(`<span class="tag peek" data-act="peek-view">👁 已窥探 ${seen.length} 张 · 点我回看</span>`);
    }
    $(who === 'A' ? 'tagsA' : 'tagsB').innerHTML = tags.join('');
  }

  if (ui.mode === 'online') {
    $('nameA').textContent = ui.seat === 'A' ? '玩家 A（你）' : '玩家 A（对手）';
    $('nameB').textContent = ui.seat === 'B' ? '玩家 B（你）' : '玩家 B（对手）';
  } else {
    $('nameA').textContent = ui.mode === 'ai' ? '玩家 A（你）' : '玩家 A';
    $('nameB').textContent = ui.mode === 'hotseat' ? '玩家 B' : '玩家 B（电脑）';
  }

  renderPiles(st);
  renderArena();
}

function renderPiles(st) {
  const deckN = st.deck.length;
  // 张数不公开时，牌堆一律画满 8 层，免得「层数变少」间接暴露剩余张数
  const deckLayers = deckN === 0 ? 0 : (RULES.revealDeckCount ? Math.min(8, deckN) : 8);
  $('deckStack').innerHTML = Array.from({ length: deckLayers }, (_, i) =>
    `<div class="layer" style="--i:${i}">${backHtml()}</div>`).join('');
  $('deckCount').textContent = RULES.revealDeckCount ? String(deckN) : (deckN === 0 ? '0' : '?');
  $('pileDeck').classList.toggle('empty', deckN === 0);

  const disc = st.discard;
  const topN = Math.min(3, disc.length);
  let dhtml = '';
  for (let i = 0; i < topN; i++) {
    const id = disc[disc.length - topN + i];
    const isTop = i === topN - 1;
    const inner = RULES.revealDiscard && isTop ? cardHtml(faceOf(st.cards[id])) : backHtml();
    dhtml += `<div class="layer" style="--i:${i}">${inner}</div>`;
  }
  $('discardStack').innerHTML = dhtml;
  $('discardCount').textContent = String(disc.length);
  $('pileDiscard').classList.toggle('empty', disc.length === 0);
}

const sideName = (who) => (ui.mode === 'online'
  ? (who === ui.seat ? '你' : '对手')
  : ui.mode === 'ai' ? (who === 'A' ? '你' : '电脑') : '玩家 ' + who);

// 打出的能力牌在判定区停留（谁打了一看就知道是谁的）
function showFnCard(who, name) {
  ui.fnShow = ui.fnShow ?? {};
  ui.fnShow[who] = name;
  clearTimeout(ui.fnTimer);
  if (!canAnimate()) return;
  ui.fnTimer = setTimeout(() => { ui.fnShow = null; if (ui.s && !ui.s.state.winner) render(); }, 3200);
}

function fnSlotHtml(who, shown, submitted) {
  const name = sideName(who);
  if (shown) return cardHtml(labelFace(shown)) + `<span class="badge">${name} · ${shown}</span>`;
  if (submitted) return backHtml('flip') + `<span class="badge">${name} · 已暗置</span>`;
  return `<div class="card ghost"></div><span class="badge quiet">${name} · 待出牌</span>`;
}

function renderFnArena(p) {
  $('arenaTitle').textContent = '能力牌';
  const me = currentViewer();
  const leftWho = ui.mode === 'demo' ? 'A' : other(me);
  const rightWho = ui.mode === 'demo' ? 'B' : me;
  const sub = p.submitted ?? [];
  $('slotA').innerHTML = fnSlotHtml(leftWho, ui.fnShow?.[leftWho], sub.includes(leftWho));
  $('slotB').innerHTML = fnSlotHtml(rightWho, ui.fnShow?.[rightWho], sub.includes(rightWho));
  $('verdict').innerHTML = sub.length === 0 ? '双方同时暗置，各出最多 1 张'
    : sub.length === 1 ? '已提交 1/2，等另一方' : '双方都已提交';
}

function renderArena() {
  const st = ui.s.state;
  const p = st.pending;
  const slotA = $('slotA');
  const slotB = $('slotB');
  if (ui.battle && p?.kind !== 'declare-phase') { drawBattle(); return; }
  if (p?.kind === 'function-phase' || (!p && ui.fnShow)) { renderFnArena(p ?? { submitted: [] }); return; }
  const me = currentViewer();
  const leftWho = ui.mode === 'demo' ? 'A' : other(me);
  const rightWho = ui.mode === 'demo' ? 'B' : me;
  const declared = p?.kind === 'declare-phase' ? p.submitted : [];
  const side = (who) => (declared.includes(who)
    ? `${backHtml('flip')}<span class="badge">${sideName(who)} · 已锁定</span>`
    : `<div class="card ghost"></div><span class="badge quiet">${sideName(who)} · 待宣告</span>`);
  const preview = comboPreview();
  slotA.innerHTML = side(leftWho);
  if (preview) {
    slotB.innerHTML = preview;
    $('arenaTitle').textContent = '你的出战组合';
    $('verdict').innerHTML = '点这张牌可拆开重选';
  } else {
    slotB.innerHTML = side(rightWho);
    $('arenaTitle').textContent = '对抗宣告';
    $('verdict').innerHTML = declared.length === 0 ? '双方同时暗置' : `已提交 ${declared.length}/2`;
  }
}

/* ---------------- 出战组合预览（人牌 + 道具自动合成身份，可再点拆开） ---------------- */
function comboPreview() {
  const st = ui.s.state;
  const actor = ui.s.actor();
  if (!actor || ui.mode === 'demo') return '';
  if (currentViewer() !== actor) return '';
  const sel = ui.sel;
  const person = sel.personId ? st.cards[sel.personId] : null;
  const item = sel.itemId ? st.cards[sel.itemId] : null;
  if (!person && !item) return '';
  let id = null;
  if (person) id = identityOf({ person, item }, Boolean(st.berserk[actor]));
  const cards = [person, item].filter(Boolean)
    .map((c) => cardHtml(faceOf(c), 'flip', `data-card="${c.id}"`)).join('');
  const merged = id ? `已合成 <b>${id}</b>` : '再选一张人牌才能出战';
  const zhan = id && !item && st.berserk[actor] ? '（背水一战临时变身，仅你可见）' : '';
  return `<div class="side"><div class="sidecards">${cards}</div>`
    + `<div class="sideid">${id ?? '待定'}</div>`
    + `<div class="hint">${merged}${zhan}</div></div>`;
}

/* ---------------- 战斗判定播放（分段放慢，逐条讲清） ---------------- */
const BTL_MS = { reveal: 1100, thief: 1750, ident: 1700, settle: 1250, skip: 1300 };
const BTL_DOTS = '①②③④⑤⑥';
const BTL_TITLE = {
  reveal: '同时亮牌',
  thief: '贼效果优先结算',
  ident: '身份克制判定',
  settle: '战利品处理',
  skip: '跳过战斗结算',
};

function blankStory() {
  return { reveal: null, cloaks: [], steals: [], result: null, penalties: [], choice: null, settled: false };
}

function battleSteps(story) {
  if (!story.reveal) return ['skip'];
  const steps = ['reveal'];
  if (story.cloaks.length) steps.push('thief');
  steps.push('ident', 'settle');
  return steps;
}

function battleBusy() { return Boolean(ui.battle && ui.battle.timer); }

function startBattle(story) {
  if (ui.battle && ui.battle.timer) clearTimeout(ui.battle.timer);
  ui.battle = { story, steps: battleSteps(story), t: 0, timer: null };
  queueBanner('战斗结算', '逐条判定，点牌桌中央可快进');
  if (!canAnimate()) { ui.battle.t = ui.battle.steps.length - 1; return; }
  ui.battle.timer = setTimeout(tickBattle, BTL_MS[ui.battle.steps[0]] ?? 1200);
}

function tickBattle() {
  const b = ui.battle;
  if (!b) return;
  b.timer = null;
  if (b.t >= b.steps.length - 1) { finishBattle(); return; }
  b.t += 1;
  renderArena();
  b.timer = setTimeout(tickBattle, BTL_MS[b.steps[b.t]] ?? 1200);
}

function finishBattle() {
  if (ui.battle) ui.battle.timer = null;
  if (!ui.s) return;
  render();
  drainGameOverBanner();
}

function drainGameOverBanner() {
  if (!ui.overBannerPending || battleBusy()) return;
  ui.overBannerPending = false;
  bannerQ.length = 0;
  const w = ui.s?.state?.winner;
  queueBanner('对局结束', w ? w.reason : '');
}

// 战利品二选一：轮到自己选时，把两张出战牌变成「点你要留下的那张」
// （点 = 选中并变亮放大，真正的提交在提示里的「确认选择」）
function rewardPick() {
  if (battleBusy()) return null;
  const st = ui.s?.state;
  const p = st?.pending;
  if (p?.kind !== 'battle-reward') return null;
  const actor = ui.s.actor();
  if (!actor) return null;
  if (p.winner !== actor) return null;
  if (ui.s.isBot(actor)) return null;
  if (currentViewer() !== actor) return null;
  return { winner: p.winner, loser: other(p.winner) };
}

function drawBattle() {
  const b = ui.battle;
  const story = b.story;
  const cur = b.steps[b.t];
  const reached = (k) => b.steps.includes(k) && b.t >= b.steps.indexOf(k);
  const arena = $('arena');
  arena.classList.toggle('clash', cur === 'ident');
  arena.classList.toggle('thieving', cur === 'thief');
  arena.classList.toggle('settling', cur === 'settle');
  $('arenaTitle').textContent = `战斗结算 · ${BTL_TITLE[cur] ?? ''}`;
  if (b.t < b.steps.length - 1) $('arenaTitle').textContent += '（点击此处快进）';
  const pick = story.result && story.result.kind === 'win' ? rewardPick() : null;
  arena.classList.toggle('choosing', Boolean(pick));
  const sideHtml = (who, html) => {
    if (!pick) return html;
    const act = who === pick.winner ? 'keep' : 'take';
    const on = ui.sel.reward === act ? ' on' : '';
    const tip = act === 'keep' ? '① 留这张' : '② 收这张';
    return `<div class="pickwrap${on}" data-reward="${act}">${html}`
      + `<span class="pickhint">${ui.sel.reward === act ? '已选 · ' + tip : tip}</span></div>`;
  };
  const me = currentViewer();
  const leftWho = ui.mode === 'demo' ? 'A' : other(me);
  const rightWho = ui.mode === 'demo' ? 'B' : me;
  if (!story.reveal) {
    $('slotA').innerHTML = '<div class="card ghost"></div>';
    $('slotB').innerHTML = '<div class="card ghost"></div>';
  } else {
    $('slotA').innerHTML = sideHtml(leftWho, revealSide(story.reveal[leftWho], leftWho, story, reached));
    $('slotB').innerHTML = sideHtml(rightWho, revealSide(story.reveal[rightWho], rightWho, story, reached));
  }
  $('verdict').innerHTML = `<div class="btl">${battleLines(story, b.steps, b.t)}</div>`;
}

function battleLines(story, steps, t) {
  const k = steps[Math.max(0, Math.min(t, steps.length - 1))];
  return `<div class="btl-seg cur">`
    + `<div class="btl-step">${BTL_DOTS[t] ?? '·'} ${BTL_TITLE[k] ?? ''}</div>`
    + `<div class="btl-body">${stepBody(k, story)}</div></div>`;
}

const comboTxt = (c) => (!c || !c.fight ? '不出战' : c.person + (c.item ? ' + ' + c.item : ''));

function stepBody(k, story) {
  const r = story.reveal;
  if (k === 'skip') {
    const rows = story.penalties.map((x) => (x.passer && x.taker
      ? `<span class="to-hand">${x.taker} 随机夺走 ${x.passer} 手牌里的 1 张</span>`
      : `<span class="to-zone">${x.text ?? '未形成双方对战'}</span>`));
    return rows.join('') || '<span class="to-zone">双方都没出战</span>';
  }
  if (k === 'reveal') {
    return `<span class="ln">${sideName('A')} <b>${r.A.identity}</b>（${comboTxt(r.A)}）　${sideName('B')} <b>${r.B.identity}</b>（${comboTxt(r.B)}）</span>`;
  }
  if (k === 'thief') {
    const rows = story.cloaks.map((who) => {
      const s = story.steals.find((x) => x.side === who);
      const extra = !s ? ''
        : s.stolen
          ? `<span class="to-hand">并夺走 ${s.from} 出战组合里的武器 → ${who} 的手牌</span>`
          : '<span class="to-zone">对手出战组合里没有武器，夺不到</span>';
      return `<span class="ln">${who} 弃掉隐身衣</span>${extra}`;
    });
    return rows.join('');
  }
  if (k === 'ident') {
    const cmp = compareIdentity(r.A.identity, r.B.identity);
    let main;
    if (cmp === 'draw') {
      main = `<span class="ln"><b>${r.A.identity}</b> 与 <b>${r.B.identity}</b> 互不克制 → <b>平局</b></span>`;
      if (r.A.identity === '贼' || r.B.identity === '贼') main += '<span class="k">贼对任何身份都是平局</span>';
    } else {
      const w = cmp === 'a' ? 'A' : 'B';
      const wv = cmp === 'a' ? r.A.identity : r.B.identity;
      const lv = cmp === 'a' ? r.B.identity : r.A.identity;
      main = `<span class="ln"><b>${sideName(w)}</b> 胜出：<b>${wv}</b> <span class="k">克制</span> <b>${lv}</b></span>`;
    }
    return main;
  }
  if (k === 'settle') {
    const res = story.result;
    if (!res) return '<span class="to-zone">等待结算…</span>';
    if (res.kind === 'draw') {
      return RULES.drawDiscardsBattleCards
        ? '<span class="to-discard">双方出战卡牌全部进入弃牌堆</span>'
        : '<span class="to-hand">双方出战卡牌全部返还各自手牌</span>';
    }
    const w = res.winner;
    const l = other(w);
    if (!story.choice) return '<span class="to-zone">等待胜者二选一：保留自己的，或收下对手的…</span>';
    return story.choice === 'keep'
      ? `<span class="to-hand">${w} 保留自己的出战牌（${comboTxt(r[w])}）→ 回到手牌</span>`
        + `<span class="to-discard">${l} 的出战牌（${comboTxt(r[l])}）→ 弃牌堆</span>`
      : `<span class="to-discard">${w} 弃掉自己的出战牌（${comboTxt(r[w])}）→ 弃牌堆</span>`
        + `<span class="to-hand">${l} 的出战牌（${comboTxt(r[l])}）→ ${w} 收入手牌</span>`;
  }
  return '';
}

function revealSide(d, who, story, reached) {
  if (!d || !d.fight) return `<div class="card ghost"></div><span class="badge">${who} · 不出战</span>`;
  const gone = Boolean(story) && (
    (story.cloaks.includes(who) && reached('thief'))
    || (reached('thief') && story.steals.some((s) => s.stolen && s.from === who)));
  const res = story ? story.result : null;
  // 克制判定出结果后，赢的一方金光上浮，输的一方压暗下沉
  const judged = Boolean(story) && reached('ident') && res && res.kind === 'win';
  const win = judged && res.winner === who;
  const lose = judged && res.winner !== who;
  const tag = win ? ' bwin' : lose ? ' blose' : '';
  const cls = d.identity === '贼' ? 'winner-glow' : '';
  return cardHtml(labelFace(d.person), `flip ${cls}${tag}`)
    + (d.item ? cardHtml(labelFace(d.item), `flip${gone ? ' dimmed' : ''}${tag}`) : '')
    + `<span class="badge${win ? ' won' : lose ? ' lost' : ''}">${sideName(who)} · ${d.identity}</span>`;
}
