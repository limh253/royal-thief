<!DOCTYPE html>
<html lang="zh-CN" data-single-file>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>王权窃贼 · Royal Thief</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>♛</text></svg>" />
<style>
/* 王权窃贼 · 三国杀式牌桌（中世纪羊皮纸 + 铁与血） */
:root {
  --gold: #e6c469;
  --gold-dim: #a98f45;
  --ink: #050a08;
  --felt-1: #14372c;
  --felt-2: #08130f;
  --panel: rgba(9, 20, 16, 0.92);
  --line: rgba(230, 196, 105, 0.22);
  --card-w: 96px;
  --card-h: 112px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(120% 86% at 50% 4%, #241a12 0%, #0d0906 58%, #030201 100%);
  color: #ede3cd;
  font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  overflow: hidden;
}

.hidden { display: none !important; }

.app { display: flex; flex-direction: column; height: 100vh; min-height: 620px; }

/* ---------------- 顶栏 ---------------- */
.topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 8px 18px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(22, 48, 38, .96), rgba(7, 16, 12, .9));
  z-index: 20;
}
.brand { display: flex; align-items: baseline; gap: 8px; }
.crest { color: var(--gold); font-size: 21px; text-shadow: 0 0 14px rgba(230, 196, 105, .6); }
.title { font-size: 18px; font-weight: 700; letter-spacing: 4px; color: #f7e9c2; }

.phasebar { display: flex; gap: 4px; margin: 0 auto; }
.ph {
  font-size: 12px; padding: 4px 10px; border-radius: 20px; white-space: nowrap;
  border: 1px solid transparent; color: #7f9a8b; background: rgba(255, 255, 255, .03);
}
.ph.done { color: #b9cbbd; border-color: rgba(230, 196, 105, .16); }
.ph.on {
  color: #241c05; font-weight: 700;
  background: linear-gradient(180deg, #f0d489, #b8923c);
  box-shadow: 0 0 16px rgba(230, 196, 105, .45);
}

.controls { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; color: #cdd8cd; border: 0; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button:hover { background: rgba(230, 196, 105, .12); }
.seg button.on { background: linear-gradient(180deg, #e6c469, #b8923c); color: #26200c; font-weight: 700; }
.ghost {
  background: rgba(230, 196, 105, .08); color: #e9dfc4; border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
}
.ghost:hover { background: rgba(230, 196, 105, .18); }
.chk { font-size: 12px; color: #b9c6ba; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.seedline { font-size: 12px; color: #8fa294; }
.seedline span { color: var(--gold); font-weight: 600; }
/* ---------------- 牌桌 ---------------- */
.board {
  position: relative; flex: 1; min-height: 0; overflow: hidden;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
  gap: 6px; padding: 10px 22px 12px;
  background:
    radial-gradient(44% 36% at 50% 43%, rgba(255, 197, 116, .13), transparent 74%),
    radial-gradient(78% 64% at 50% 46%, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, .74) 100%),
    repeating-linear-gradient(91deg, rgba(0, 0, 0, .16) 0 2px, rgba(255, 224, 176, .022) 2px 4px, rgba(0, 0, 0, .05) 4px 8px),
    repeating-linear-gradient(88.5deg, rgba(0, 0, 0, .12) 0 11px, rgba(146, 96, 46, .07) 11px 22px),
    linear-gradient(168deg, #3d2716 0%, #2a1a10 44%, #140c06 100%);
}
.board::after {
  content: ""; position: absolute; inset: 7px; border-radius: 18px; pointer-events: none;
  border: 1px solid rgba(230, 196, 105, .16);
  box-shadow: inset 0 0 0 4px rgba(0, 0, 0, .3), inset 0 0 0 5px rgba(230, 196, 105, .1),
    inset 0 0 90px rgba(0, 0, 0, .55);
  background:
    linear-gradient(90deg, rgba(230, 196, 105, .3), transparent 6%, transparent 94%, rgba(230, 196, 105, .3)) no-repeat,
    linear-gradient(180deg, rgba(230, 196, 105, .22), transparent 5%, transparent 95%, rgba(230, 196, 105, .22)) no-repeat;
}

.seat { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.seathead { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cfdccf; flex-wrap: wrap; }
.seat.me .seathead { justify-content: flex-start; }
.avatar {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: 14px; color: #241c05; background: linear-gradient(180deg, #f0d489, #b8923c);
  box-shadow: 0 0 12px rgba(230, 196, 105, .35);
}
.seat.opp .avatar { background: linear-gradient(180deg, #b9c1d4, #7c869c); color: #1a1f2b; box-shadow: none; }
.who { font-weight: 600; letter-spacing: 1px; }
.handcount {
  font-size: 12px; padding: 1px 9px; border-radius: 20px;
  border: 1px solid var(--line); color: var(--gold); background: rgba(0, 0, 0, .3);
}
.tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag {
  font-size: 11px; padding: 1px 8px; border-radius: 20px;
  border: 1px solid var(--line); color: #d8e2d8; background: rgba(0, 0, 0, .28);
}
.tag.warn { border-color: #e2a33c; color: #ffd58a; background: rgba(226, 163, 60, .12); }
.tag.act { border-color: #7fd8b0; color: #b8f5d8; background: rgba(127, 216, 176, .12); }

.hand {
  display: flex; align-items: flex-end; gap: 7px; flex-wrap: wrap;
  min-height: calc(var(--card-h) + 6px);
}
.hand.compact { --card-w: 74px; --card-h: 86px; gap: 5px; }
.hand.tiny { --card-w: 58px; --card-h: 68px; gap: 4px; }
.hand.empty::after { content: "（手牌为空）"; color: #7d8f83; font-size: 13px; }
.stackmany { color: #9db3a5; font-size: 12px; margin-left: 6px; align-self: center; }
.hand .card.back + .card.back { margin-left: calc(var(--card-w) * -0.48); }
/* ---------------- 卡牌 ---------------- */
.card {
  position: relative; flex: none; width: var(--card-w); height: var(--card-h);
  border-radius: 9px; overflow: hidden; background: #10151b;
  border: 1px solid rgba(0, 0, 0, .55);
  box-shadow: 0 6px 16px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .06);
  transition: transform .16s ease, box-shadow .16s ease, filter .18s ease;
  user-select: none; animation: dealIn .34s cubic-bezier(.2, .9, .3, 1.15) backwards;
}
.cardart { position: absolute; inset: 0; }
.cardart .art { width: 100%; height: 100%; display: block; }
.card .plate {
  position: absolute; left: 3px; right: 3px; bottom: 3px; padding: 3px 4px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 0;
  border-radius: 3px 3px 4px 4px;
  background: linear-gradient(180deg, rgba(14, 10, 6, .06) 0%, rgba(18, 12, 6, .78) 34%, rgba(10, 7, 4, .95) 100%);
  box-shadow: 0 -8px 14px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(230, 196, 105, .22);
  font-family: Georgia, "Times New Roman", "Songti SC", "STSong", "SimSun", serif;
}
.card .plate b { font-size: 11px; letter-spacing: .5px; color: #f6e7c4; font-weight: 700; }
.card .plate i { font-size: 8.5px; font-style: normal; color: #a99a72; }
.card .corner {
  position: absolute; top: 3px; left: 5px; font-size: 9px; letter-spacing: 1px;
  color: #f0dfb4; opacity: .8; text-shadow: 0 1px 3px #000;
}
.card.good { border-color: rgba(147, 174, 203, .55); }
.card.evil { border-color: rgba(255, 150, 130, .45); }
.card.weapon { border-color: rgba(207, 216, 227, .45); }
.card.crown { border-color: rgba(242, 193, 78, .6); }
.card.cloak { border-color: rgba(201, 210, 255, .4); }
.card.func { border-color: rgba(159, 230, 200, .4); }

.card:hover { transform: translateY(-12px) scale(1.05); z-index: 6; box-shadow: 0 18px 34px rgba(0, 0, 0, .62); }
.hand .card[data-card] { cursor: pointer; }
.card.playable { box-shadow: 0 0 0 2px rgba(127, 216, 176, .55), 0 8px 18px rgba(0, 0, 0, .5); }
.card.playable:hover { box-shadow: 0 0 0 2px rgba(127, 216, 176, .9), 0 18px 34px rgba(0, 0, 0, .62); }
.card.selected {
  transform: translateY(-16px) scale(1.07);
  box-shadow: 0 0 0 3px rgba(230, 196, 105, .95), 0 0 26px rgba(230, 196, 105, .6), 0 18px 34px rgba(0, 0, 0, .6);
}
.card.dimmed { filter: grayscale(.7) brightness(.6); }
.card.flip { animation: flipIn .42s cubic-bezier(.2, .9, .3, 1.15) backwards; }
.card.winner-glow { box-shadow: 0 0 0 3px rgba(230, 196, 105, .9), 0 0 30px rgba(230, 196, 105, .65); }
.card.ghost { border-style: dashed; border-color: rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .03); box-shadow: none; }
.card.big { --card-w: 168px; --card-h: 196px; animation: none; box-shadow: 0 24px 52px rgba(0, 0, 0, .72); }
.card.big .plate b { font-size: 16px; }
.card.big .plate i { font-size: 11px; }
.card.big .corner { font-size: 13px; }

@keyframes dealIn {
  from { opacity: 0; transform: translateY(26px) scale(.9); }
  to { opacity: 1; transform: none; }
}
@keyframes flipIn {
  0% { transform: rotateY(90deg) scale(.9); opacity: .2; }
  100% { transform: none; opacity: 1; }
}
/* ---------------- 中央牌桌 ---------------- */
.table {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 16px; min-height: 0; padding: 2px 8px;
}

.pile { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.pilecards {
  position: relative; width: 78px; height: 94px;
  --card-w: 78px; --card-h: 94px;
}
.pilecards .layer {
  position: absolute; inset: 0;
  transform: translate(calc(var(--i, 0) * 1.1px), calc(var(--i, 0) * -1.6px)) rotate(calc(var(--i, 0) * .3deg));
}
.pilecards .layer .card {
  position: absolute; inset: 0; width: 100%; height: 100%; animation: none; transform: none;
}
.pilelabel { font-size: 11px; letter-spacing: 2px; color: var(--gold-dim); }
.pilecount {
  font-size: 13px; min-width: 32px; text-align: center; color: var(--gold);
  border: 1px solid var(--line); border-radius: 20px; padding: 0 8px; background: rgba(0, 0, 0, .35);
}
.pile.empty .pilecards { opacity: .3; }
.pile.empty .pilecount { color: #7d8f83; }

.arena {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 10px 16px; min-height: 152px;
  border: 1px solid var(--line); border-radius: 14px;
  background: rgba(0, 0, 0, .22);
  box-shadow: inset 0 0 40px rgba(0, 0, 0, .35);
}
.arenatitle { font-size: 11px; letter-spacing: 3px; color: var(--gold-dim); }
.slots { display: flex; align-items: center; gap: 14px; }
.slot { display: flex; align-items: center; gap: 5px; min-height: 100px; }
.slot .card { --card-w: 72px; --card-h: 84px; }
.vs { font-weight: 700; letter-spacing: 2px; color: var(--gold-dim); font-size: 13px; }
.verdict { font-size: 12px; color: #c9d6c9; text-align: center; max-width: 420px; }
.verdict b { color: #f7e9c2; }
.badge {
  font-size: 10.5px; padding: 1px 7px; border-radius: 10px;
  border: 1px solid var(--line); color: #e9dfc4; background: rgba(0, 0, 0, .35); white-space: nowrap;
}
/* ---------------- 底部操作条 ---------------- */
.actionbar { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 4; }
.turnbar {
  padding: 6px 12px; border-radius: 9px; font-size: 12.5px;
  background: rgba(230, 196, 105, .09); border: 1px solid var(--line); color: #f2e6c6;
}
.turnbar .zhi { color: #ffd58a; }

.prompt {
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
  padding: 8px 11px; border-radius: 11px; min-height: 46px;
  border: 1px solid transparent; background: rgba(0, 0, 0, .26);
  max-height: 22vh; overflow: auto;
}
.prompt.mine {
  border-color: rgba(230, 196, 105, .5);
  background: rgba(230, 196, 105, .08);
  box-shadow: inset 0 0 24px rgba(230, 196, 105, .08);
}
.plabel {
  font-size: 11px; letter-spacing: 2px; color: var(--gold);
  padding-right: 4px; border-right: 1px solid var(--line); margin-right: 2px;
}
.hint { font-size: 13px; color: #b7c8b9; }
.hint.warn { color: #ffd58a; }

button.act {
  border: 1px solid rgba(230, 196, 105, .45); border-radius: 8px; padding: 7px 14px; cursor: pointer;
  background: linear-gradient(180deg, rgba(230, 196, 105, .92), rgba(180, 145, 60, .92));
  color: #241c05; font-weight: 700; font-size: 13px;
  transition: filter .15s, transform .12s;
}
button.act:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
button.act.secondary { background: rgba(255, 255, 255, .07); color: #e3ecdf; font-weight: 500; border-color: var(--line); }
button.act:disabled { opacity: .4; cursor: not-allowed; }

.chip {
  font-size: 12.5px; padding: 5px 11px; border-radius: 20px; cursor: pointer;
  border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: #e6efe4;
  transition: filter .15s, transform .12s;
}
.chip:hover { filter: brightness(1.2); transform: translateY(-1px); }
.chip.on {
  background: rgba(127, 216, 176, .26); border-color: #7fd8b0; color: #d8ffe9; font-weight: 700;
}
/* ---------------- 环节横幅 ---------------- */
.banner {
  position: fixed; left: 50%; top: 33%; transform: translate(-50%, -50%);
  z-index: 65; pointer-events: none; text-align: center; opacity: 0;
}
.banner b {
  display: block; font-size: 46px; letter-spacing: 12px; color: #f9edcb;
  text-shadow: 0 0 26px rgba(230, 196, 105, .6), 0 6px 22px rgba(0, 0, 0, .95);
}
.banner i {
  display: block; font-style: normal; font-size: 13px; letter-spacing: 5px;
  color: var(--gold); margin-top: 8px; text-shadow: 0 2px 10px #000;
}
/* 时长必须和 app.js 里 drainBanner 的 780ms 队列间隔一致：
   否则上一条还没淡出，下一条已经出现，两行字会在屏幕中间叠在一起（很难看） */
.banner.show { animation: bannerIn .78s cubic-bezier(.2, .8, .3, 1) forwards; }
@keyframes bannerIn {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.8); }
  16% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -56%) scale(1.04); }
}

/* ---------------- 悬停放大 ---------------- */
.zoom {
  position: fixed; z-index: 70; display: flex; align-items: flex-end; gap: 12px;
  pointer-events: none; opacity: 0; transform: translateY(8px);
  transition: opacity .13s ease, transform .13s ease;
}
.zoom.show { opacity: 1; transform: none; }
.zoominfo {
  width: 246px; padding: 11px 13px; border-radius: 11px;
  background: rgba(7, 16, 13, .96); border: 1px solid var(--line);
  box-shadow: 0 16px 34px rgba(0, 0, 0, .7);
}
.zoominfo .zt { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #f7e9c2; }
.zoominfo .zs { font-size: 11px; color: var(--gold-dim); margin: 2px 0 7px; letter-spacing: 1px; }
.zoominfo .zd { font-size: 12.5px; line-height: 1.62; color: #c8d6c9; }
.zoominfo .zk { margin-top: 7px; font-size: 11px; color: #7fd8b0; }

/* 飞牌动画层 */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 80; }
.fx .card { --card-w: 60px; --card-h: 70px; animation: none; box-shadow: 0 14px 30px rgba(0, 0, 0, .6); }
.fx .counter {
  position: absolute; font-size: 13px; font-weight: 700; color: #f7e9c2;
  text-shadow: 0 0 12px rgba(230, 196, 105, .8), 0 2px 8px #000; white-space: nowrap;
}
/* ---------------- 战报浮层 ---------------- */
.logpanel {
  position: fixed; right: 0; top: 52px; bottom: 0; width: min(380px, 94vw);
  z-index: 58; display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(14, 32, 26, .98), rgba(6, 14, 11, .98));
  border-left: 1px solid var(--line); box-shadow: -18px 0 46px rgba(0, 0, 0, .55);
  animation: slideIn .22s ease backwards;
}
@keyframes slideIn { from { transform: translateX(100%); opacity: .3; } to { transform: none; opacity: 1; } }
.loghead {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid var(--line); color: #f7e9c2; letter-spacing: 2px;
}
.tabs { display: flex; gap: 6px; padding: 8px 14px 4px; }
.tabs button {
  flex: 1; font-size: 12px; padding: 6px 0; cursor: pointer; border-radius: 6px;
  background: rgba(255, 255, 255, .04); color: #a9bcae; border: 1px solid transparent;
}
.tabs button.on { background: rgba(230, 196, 105, .16); color: #f5e7c4; border-color: var(--line); }
.log { flex: 1; overflow: auto; padding: 6px 14px 18px; font-size: 12.5px; color: #c8d6c9; }
.log div { padding: 3px 0; border-bottom: 1px dashed rgba(255, 255, 255, .05); }
.log .lv-private { color: #ffd98f; }

/* ---------------- 诊断条 ---------------- */
.fatal {
  background: linear-gradient(180deg, #7d1f1f, #5a1414);
  color: #ffe6e6; border-bottom: 1px solid #ff9a9a;
  padding: 10px 16px; font-size: 13px; line-height: 1.6;
}
.fatal b { color: #fff3b0; }
.fatal-detail { margin-top: 4px; color: #ffd0d0; font-size: 12px; word-break: break-all; }
.fatal code { background: rgba(0, 0, 0, .3); padding: 1px 5px; border-radius: 4px; color: #ffe9a8; }

/* ---------------- 遮罩 / 提示 ---------------- */
.overlay {
  position: fixed; inset: 0; background: rgba(3, 8, 6, .93); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; z-index: 90;
}
.ovcard {
  width: min(640px, 94vw); max-height: 90vh; overflow: auto;
  border: 1px solid var(--line); border-radius: 16px;
  background: linear-gradient(180deg, rgba(18, 42, 34, .98), rgba(8, 18, 14, .98));
  padding: 24px 28px; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
}
.ovcard h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: 3px; color: #f7e9c2; }
.ovcard h4 { margin: 0 0 8px; font-size: 12px; color: var(--gold-dim); letter-spacing: 2px; font-weight: 500; }
.ovcard p { color: #b9c9ba; margin: 6px 0 16px; }
.ovcard .hands { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0 14px; }
.ovcard .hands .card { --card-w: 62px; --card-h: 72px; }
.ovcard .reveal-row { display: flex; gap: 18px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }
.ovcard .reveal-col { flex: 1; min-width: 200px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

.toast {
  position: fixed; left: 50%; top: 66px; transform: translateX(-50%);
  background: rgba(12, 26, 20, .96); border: 1px solid var(--line); color: #f4e8c8;
  padding: 10px 18px; border-radius: 10px; z-index: 85; font-size: 13.5px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .55); animation: toastIn .25s ease backwards;
  max-width: 84vw; text-align: center;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -12px); } to { opacity: 1; transform: translate(-50%, 0); } }

.rules-doc { text-align: left; font-size: 13px; color: #cbd8cb; }
.rules-doc h3 { color: var(--gold); font-size: 14px; margin: 14px 0 6px; }
.rules-doc ul { margin: 0; padding-left: 18px; }
.rules-doc code { color: #ffd98f; }

@media (max-width: 1120px) {
  :root { --card-w: 78px; --card-h: 91px; }
  .slot .card { --card-w: 60px; --card-h: 70px; }
  .table { gap: 10px; }
}
@media (max-width: 860px) {
  :root { --card-w: 64px; --card-h: 75px; }
  .phasebar { order: 3; width: 100%; justify-content: center; }
  .banner b { font-size: 30px; letter-spacing: 6px; }
  .zoominfo { display: none; }
}
/* ================= 中世纪质感覆盖层（后写的同权重规则生效） ================= */
.title, .banner b, .banner i, .arenatitle, .verdict, .pilecount, .plabel, .ovcard h2, .ovcard h4, .sideid {
  font-family: Georgia, "Times New Roman", "Songti SC", "STSong", "SimSun", serif;
}
.title { letter-spacing: 6px; text-shadow: 0 2px 10px rgba(0, 0, 0, .8), 0 0 22px rgba(230, 196, 105, .3); }
.banner b { text-shadow: 0 0 30px rgba(230, 196, 105, .55), 0 8px 26px rgba(0, 0, 0, 1); }
.seathead { font-family: Georgia, "Songti SC", "STSong", serif; letter-spacing: 1px; }

.topbar {
  background: linear-gradient(180deg, #2b1c11 0%, #180f08 70%, #0d0805 100%);
  border-bottom: 1px solid rgba(230, 196, 105, .3);
  box-shadow: 0 6px 20px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 226, 160, .12);
}
.ghost, .seg { background: rgba(0, 0, 0, .35); border-color: rgba(230, 196, 105, .28); }
.ghost:hover { background: rgba(230, 196, 105, .16); }
.seg button.on { background: linear-gradient(180deg, #f0d489, #a97f28); box-shadow: inset 0 1px 0 rgba(255, 245, 210, .7); }
.ph.on { background: linear-gradient(180deg, #f0d489, #a97f28); }

.turnbar {
  background: linear-gradient(180deg, rgba(24, 15, 9, .92), rgba(12, 8, 5, .92));
  border-color: rgba(230, 196, 105, .26);
  box-shadow: inset 0 1px 0 rgba(255, 226, 160, .08);
}
.prompt {
  justify-content: center;
  border: 0;
  text-shadow: 0 2px 8px rgba(0, 0, 0, .96), 0 0 3px rgba(0, 0, 0, .9);
  background: radial-gradient(130% 160% at 50% 50%, rgba(5, 9, 7, .8), rgba(5, 9, 7, .32) 64%, rgba(5, 9, 7, 0) 100%);
  box-shadow: none;
}
.prompt.mine {
  border: 0;
  background: radial-gradient(130% 160% at 50% 50%, rgba(48, 31, 12, .9), rgba(30, 19, 8, .42) 64%, rgba(30, 19, 8, 0) 100%);
}
button.act {
  border-color: rgba(255, 232, 170, .5);
  background: linear-gradient(180deg, #f0d489, #a97f28);
  color: #1e1405; box-shadow: 0 3px 0 rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 246, 214, .8);
}
button.act.secondary { background: linear-gradient(180deg, rgba(58, 42, 22, .95), rgba(26, 18, 9, .95)); color: #ecdfc0; }
.chip { background: rgba(0, 0, 0, .38); border-color: rgba(230, 196, 105, .3); }
.chip.on { background: rgba(255, 214, 130, .2); border-color: #f0d489; color: #ffeec4; }
.plabel { color: #e9cf8c; letter-spacing: 2.5px; }

.pilecards { filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .7)); }
.pilecount {
  background: linear-gradient(180deg, #2c1d0e, #120b05);
  border-color: rgba(230, 196, 105, .4); color: #f0d489;
  box-shadow: inset 0 1px 0 rgba(255, 226, 160, .16);
}
.arena {
  background: linear-gradient(180deg, rgba(20, 13, 7, .78), rgba(8, 5, 3, .88));
  border-color: rgba(230, 196, 105, .26);
  box-shadow: inset 0 0 60px rgba(0, 0, 0, .7), 0 10px 30px rgba(0, 0, 0, .45);
}
.badge { background: linear-gradient(180deg, #2c1d0e, #120b05); border-color: rgba(230, 196, 105, .38); color: #f0d489; }
.verdict b { color: #ffe9b0; }

/* ---- 卡牌状态：功能牌阶段高亮 / 压暗 ---- */
.card:hover { transform: translateY(-14px) scale(1.055); z-index: 6; box-shadow: 0 22px 40px rgba(0, 0, 0, .74), 0 0 0 1px rgba(230, 196, 105, .38); }
.card.playable {
  transform: translateY(-11px);
  animation: playablePulse 1.9s ease-in-out infinite;
}
.card.playable::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 226, 150, .18), rgba(255, 226, 150, 0) 58%);
}
.card.playable:hover { transform: translateY(-19px) scale(1.06); }
.card.dimmed { filter: grayscale(.85) brightness(.4) contrast(.92); }
@keyframes playablePulse {
  0%, 100% { box-shadow: 0 0 0 2px rgba(255, 226, 150, .78), 0 0 18px rgba(255, 196, 96, .38), 0 14px 26px rgba(0, 0, 0, .66); }
  50% { box-shadow: 0 0 0 2px rgba(255, 242, 196, 1), 0 0 36px rgba(255, 208, 112, .78), 0 14px 26px rgba(0, 0, 0, .66); }
}

/* ---- 对抗宣告：合成预览 ---- */
.side { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.sidecards { display: flex; align-items: center; }
.sidecards .card + .card { margin-left: -46%; animation: mergeIn .3s ease backwards; }
@keyframes mergeIn { from { transform: translateX(24px) rotate(6deg); opacity: .2; } to { transform: none; opacity: 1; } }
.sideid {
  font-size: 12px; letter-spacing: 1px; padding: 2px 10px; border-radius: 20px;
  color: #ffe9b0; background: linear-gradient(180deg, #43300f, #1a1106);
  border: 1px solid rgba(230, 196, 105, .45);
  box-shadow: 0 0 16px rgba(230, 196, 105, .25);
  white-space: nowrap;
}
.sideid.win { color: #1e1405; background: linear-gradient(180deg, #ffe9a8, #c99a2e); box-shadow: 0 0 22px rgba(255, 214, 130, .7); }
.sideid.lose { color: #d9c9a8; background: linear-gradient(180deg, #241a0e, #140d06); border-color: rgba(255, 255, 255, .14); }
.sideid.plain { color: #cfc3a6; background: rgba(0, 0, 0, .45); border-color: rgba(255, 255, 255, .16); box-shadow: none; }

/* ---- 战斗判定面板 ---- */
.btl { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.btl-step {
  font-size: 11px; letter-spacing: 3px; color: #e9cf8c;
  padding: 1px 10px; border-radius: 20px; background: rgba(0, 0, 0, .45);
  border: 1px solid rgba(230, 196, 105, .3);
}
.btl-step.done { color: #9fe6c8; border-color: rgba(159, 230, 200, .45); }
.btl-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
.btl-rel { font-size: 11.5px; color: #d8c9a6; text-align: center; max-width: 130px; line-height: 1.5; }
.btl-rel b { color: #ffe9b0; }
.btl-rel .k { color: #9fe6c8; }
.btl-out { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: #cbbf9f; text-align: center; }
.btl-out .ln { color: #e6d8b4; }
.btl-out .to-hand { color: #9fe6c8; }
.btl-out .to-discard { color: #e0a08c; }
.btl-out .to-zone { color: #cbbf9f; font-style: italic; }
.slot.reveal .card { animation: flipIn .42s cubic-bezier(.2, .9, .3, 1.15) backwards; }
.slot.hold .card { animation: revealIn .5s cubic-bezier(.2, .9, .3, 1.3) backwards; }
@keyframes revealIn { 0% { opacity: 0; transform: scale(.7) rotateY(70deg); } 100% { opacity: 1; transform: none; } }
/* ================= 战斗判定逐条回放 / 组合预览 / 功能牌速览 ================= */
.arena { justify-content: center; }
.verdict { max-width: 480px; width: 100%; }
.slot { min-height: 78px; }
.slot .card { --card-w: 64px; --card-h: 74px; }

.btl { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; }
.btl-seg {
  display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%;
  opacity: .5; transition: opacity .3s ease;
}
.btl-seg.cur { opacity: 1; }
.btl-seg.cur .btl-step {
  border-color: rgba(255, 226, 150, .9); color: #ffeec4;
  box-shadow: 0 0 16px rgba(230, 196, 105, .35);
}
.btl-body {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  font-size: 11.5px; line-height: 1.45; color: #d8c9a6; text-align: center;
}
.btl-body b { color: #ffe9b0; }
.btl-body .ln { color: #e8dab6; }
.btl-body .k { color: #93aa9b; font-size: 10.5px; }
.btl-body .to-hand { color: #9fe6c8; }
.btl-body .to-discard { color: #e0a08c; }
.btl-body .to-zone { color: #cbbf9f; font-style: italic; }

/* 出战组合预览：两张牌叠合成一张，下面挂身份条 */
.sidecards { gap: 0; }
.sidecards .card + .card { margin-left: -30px; }
.side .card { --card-w: 78px; --card-h: 90px; }
.sideid {
  font-family: Georgia, "Times New Roman", "Songti SC", "STSong", "SimSun", serif;
  font-size: 13px; letter-spacing: 2px;
}
.verdict .side { margin-top: 2px; }
.verdict .side .hint { font-size: 11px; max-width: 330px; }

/* 功能牌阶段：可打的牌金色呼吸 + 效果速览 */
.chip.fn { border-color: rgba(255, 226, 150, .65); color: #ffeec4; }
.fnlist {
  display: flex; flex-direction: column; gap: 1px; width: 100%;
  margin-top: 3px; padding-top: 3px; border-top: 1px solid rgba(230, 196, 105, .16);
}
.fnlist span { font-size: 11px; color: #b9c6ba; line-height: 1.4; }
.fnlist b { color: #ffe9b0; margin-right: 5px; }
/* ================= 写出「真实牌桌」：橡木桌面 + 皮革牌垫 ================= */
.board {
  background:
    radial-gradient(36% 28% at 50% 44%, rgba(255, 206, 142, .17), rgba(255, 190, 120, 0) 74%),
    radial-gradient(78% 64% at 50% 46%, rgba(0, 0, 0, 0) 26%, rgba(0, 0, 0, .86) 100%),
    repeating-linear-gradient(177.4deg, rgba(0, 0, 0, .10) 0 1px, rgba(255, 226, 182, .028) 1px 2px, rgba(0, 0, 0, .045) 2px 5px),
    repeating-linear-gradient(175.6deg, rgba(0, 0, 0, .13) 0 3px, rgba(158, 104, 52, .085) 3px 7px, rgba(0, 0, 0, .05) 7px 14px),
    repeating-linear-gradient(180deg, rgba(0, 0, 0, .52) 0 2px, rgba(255, 219, 168, .055) 2px 3px, rgba(0, 0, 0, 0) 3px 88px),
    linear-gradient(172deg, #52341c 0%, #3a2413 38%, #1d1108 100%);
}
.table {
  position: relative; grid-template-columns: auto auto auto;
  justify-content: center; column-gap: 40px;
}
.table::before {
  content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(660px, 58vw); height: min(300px, 38vh); border-radius: 24px;
  background:
    radial-gradient(78% 66% at 50% 38%, rgba(72, 108, 84, .28), rgba(8, 16, 12, .88) 72%),
    repeating-linear-gradient(96deg, rgba(255, 255, 255, .016) 0 3px, rgba(0, 0, 0, .05) 3px 6px),
    repeating-linear-gradient(4deg, rgba(0, 0, 0, .06) 0 5px, rgba(255, 255, 255, .012) 5px 10px),
    linear-gradient(180deg, #1c2b22, #0b120e);
  border: 1px solid rgba(230, 196, 105, .16);
  box-shadow: inset 0 0 90px rgba(0, 0, 0, .78), inset 0 1px 0 rgba(255, 224, 170, .09),
    0 22px 54px rgba(0, 0, 0, .62);
  pointer-events: none; z-index: 0;
}
.table > * { position: relative; z-index: 1; }

/* 环节横幅挪到上方，别再压住牌桌中央的判定面板 */
.banner { top: 7.5%; }
.banner b { font-size: 30px; letter-spacing: 8px; }
.banner i { font-size: 12px; letter-spacing: 3px; margin-top: 4px; }
@keyframes bannerIn {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.86); }
  16% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -60%) scale(1.03); }
}

/* 牌面：让鎏金边框有立体斜面，阴影更沉 */
.card {
  border-color: rgba(0, 0, 0, .7);
  box-shadow: 0 8px 20px rgba(0, 0, 0, .62), 0 0 0 1px rgba(230, 196, 105, .12),
    inset 0 1px 0 rgba(255, 236, 196, .14);
}
.slot .side { gap: 4px; }
.slot .side .hint { font-size: 10.5px; max-width: 210px; text-align: center; line-height: 1.35; }
/* ================= 出战宣告：从底栏挪到手牌上方（三国杀式贴手出牌） ================= */
/* 出战宣告：不套面板，就是浮在手牌上方的几个控件 + 两个独立按钮 */
.prompt.dock {
  position: fixed; left: 50%; bottom: calc(var(--card-h) + 104px); transform: translateX(-50%);
  z-index: 40; width: auto; max-width: 92vw; max-height: 34vh;
  padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none;
  justify-content: center; gap: 9px;
  text-shadow: 0 2px 9px rgba(0, 0, 0, .95);
  animation: dockIn .3s cubic-bezier(.2, .9, .3, 1.15) backwards;
}
.prompt.dock::after { content: none; }
.prompt.dock .plabel {
  font-size: 12px; color: #f0d489; padding: 3px 10px; border: 0; border-radius: 20px;
  background: rgba(0, 0, 0, .55); margin: 0;
}
.prompt.dock .chip { font-size: 13.5px; padding: 7px 14px; background: rgba(6, 10, 8, .82); }
.prompt.dock .hint {
  font-size: 11.5px; color: #cfdccf; padding: 3px 10px; border-radius: 20px; background: rgba(0, 0, 0, .5);
}
.prompt.dock button.act {
  font-size: 15px; padding: 11px 28px; border-radius: 11px; letter-spacing: 1px;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 246, 214, .85);
}
.prompt.dock button.act.secondary {
  background: linear-gradient(180deg, rgba(48, 33, 16, .97), rgba(16, 10, 4, .97));
  border-color: rgba(230, 196, 105, .45); color: #ece0c2;
}
@keyframes dockIn {
  0% { opacity: 0; transform: translateX(-50%) translateY(18px) scale(.95); }
  100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}

/* ================= 战斗判定：脱离框体、把对抗放大 ================= */
.arena.battle {
  background: none; border-color: transparent; box-shadow: none;
  padding: 0; gap: 10px; min-height: 0; width: min(1060px, 76vw);
}
.arena.battle .arenatitle { font-size: 10.5px; letter-spacing: 2px; opacity: .82; }
.arena.battle .slots { gap: 30px; }
.arena.battle .slot { min-height: 150px; gap: 8px; }
.arena.battle .slot .card { --card-w: 106px; --card-h: 124px; border-radius: 11px; }
.arena.battle .slot .card + .card { margin-left: -24px; }
.arena.battle .slot .card .plate b { font-size: 12.5px; }
.arena.battle .slot .card .plate i { font-size: 9.5px; }
.arena.battle .slot .card .corner { font-size: 11px; }
.arena.battle .vs {
  font-size: 21px; letter-spacing: 4px; color: #cbb271;
  text-shadow: 0 0 20px rgba(0, 0, 0, .85);
}
.arena.battle .badge { font-size: 12.5px; padding: 2px 11px; }
.arena.battle .verdict { max-width: 980px; }

/* 解释文字收小，把视觉重心让给牌 */
.btl-step { font-size: 10.5px; letter-spacing: 2px; }
.btl-body { font-size: 11px; }
.btl-body .k { font-size: 9.5px; }

/* 每一步滑进来 */
.btl-seg.cur .btl-step { animation: stepIn .34s ease-out backwards; }
.btl-seg.cur .btl-body { animation: stepIn .36s ease-out .05s backwards; }
@keyframes stepIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: none; } }

/* 克制判定：双方对撞 + 冲击波 + VS 爆闪 */
.arena.clash .slots .slot:first-child { animation: lungeR .44s cubic-bezier(.2, .9, .3, 1.3); }
.arena.clash .slots .slot:last-child { animation: lungeL .44s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes lungeR { 0% { transform: none; } 52% { transform: translateX(22px) scale(1.05); } 100% { transform: none; } }
@keyframes lungeL { 0% { transform: none; } 52% { transform: translateX(-22px) scale(1.05); } 100% { transform: none; } }
.arena.clash .vs { animation: vsBurst .52s ease-out; }
@keyframes vsBurst {
  0% { transform: scale(1); }
  38% { transform: scale(2.05); color: #fff6da; text-shadow: 0 0 30px rgba(255, 214, 130, .95); }
  100% { transform: scale(1); }
}
.arena.clash::after {
  content: ""; position: absolute; left: 50%; top: 40%; width: 44px; height: 44px;
  margin: -22px 0 0 -22px; border-radius: 50%; pointer-events: none;
  border: 2px solid rgba(255, 226, 150, .92);
  animation: shock .64s cubic-bezier(.1, .7, .3, 1) forwards;
}
@keyframes shock { 0% { transform: scale(.28); opacity: .95; } 100% { transform: scale(11); opacity: 0; } }

/* 夺取武器 / 战利品：各自的强调色脉冲 */
.arena.thieving .slots { animation: flick .5s ease-out; }
@keyframes flick { 0% { filter: brightness(1); } 45% { filter: brightness(1.35) saturate(1.15); } 100% { filter: brightness(1); } }

/* 赢家上浮发光、输家压暗下沉 */
.card.bwin { z-index: 3; animation: bwinPulse 1.05s ease-in-out infinite; }
@keyframes bwinPulse {
  0%, 100% { box-shadow: 0 0 0 2px rgba(255, 226, 150, .85), 0 0 22px rgba(255, 196, 96, .45), 0 10px 24px rgba(0, 0, 0, .6); transform: translateY(-4px); }
  50% { box-shadow: 0 0 0 3px rgba(255, 242, 196, 1), 0 0 46px rgba(255, 208, 112, .9), 0 10px 24px rgba(0, 0, 0, .6); transform: translateY(-9px); }
}
.card.blose { animation: bloseFall .5s ease-out backwards; filter: grayscale(.72) brightness(.55) contrast(.95); }
@keyframes bloseFall { 0% { transform: none; opacity: 1; } 100% { transform: translateY(10px) scale(.94); opacity: .8; } }
.badge.won { color: #1e1405; background: linear-gradient(180deg, #ffe9a8, #c99a2e); border-color: rgba(255, 242, 196, .9); }
.badge.lost { color: #b9a98c; background: rgba(0, 0, 0, .5); border-color: rgba(255, 255, 255, .14); }

/* 判定时把皮革牌垫铺大，让放大的对抗有落点 */
.table:has(.arena.battle)::before {
  width: min(1180px, 88vw); height: min(560px, 62vh);
  border-radius: 0; border-color: transparent; box-shadow: none;
  background: radial-gradient(closest-side, rgba(4, 9, 6, .78), rgba(4, 9, 6, .46) 60%, rgba(4, 9, 6, 0) 100%);
}

/* 宣告阶段：出战槽里的合成预览也放大一点 */
.slot .side { gap: 6px; }
.slot .side .card { --card-w: 88px; --card-h: 103px; }
.slot .side .hint { font-size: 10.5px; }
/* ================= 判定区彻底去框：只剩牌和字 ================= */
.arena {
  background: none; border: 0; box-shadow: none;
  padding: 0; border-radius: 0; min-height: 0;
}
/* 牌垫改成没有边界的一团柔光，不再是一个大圆角方框 */
.table::before {
  width: min(900px, 74vw); height: min(440px, 52vh);
  border-radius: 0; border: 0; box-shadow: none;
  background: radial-gradient(closest-side, rgba(4, 9, 6, .62), rgba(4, 9, 6, .34) 62%, rgba(4, 9, 6, 0) 100%);
}
/* 空位不再是虚线框，只是一块压暗的桌面 */
.card.ghost {
  border: 1px solid rgba(255, 255, 255, .085);
  background: linear-gradient(180deg, rgba(0, 0, 0, .3), rgba(0, 0, 0, .44));
  box-shadow: inset 0 0 26px rgba(0, 0, 0, .62);
}
button.act.big { font-size: 15px; padding: 11px 26px; }

/* ================= 窥探结果（洞若观火 / 重整）================= */
.peekbox {
  position: fixed; left: 50%; top: 21%; transform: translate(-50%, -14px);
  z-index: 72; pointer-events: none; opacity: 0;
  display: flex; align-items: center; gap: 16px;
  padding: 15px 20px; border-radius: 16px;
  background: linear-gradient(180deg, rgba(42, 27, 10, .97), rgba(12, 8, 4, .98));
  border: 1px solid rgba(230, 196, 105, .55);
  box-shadow: 0 26px 64px rgba(0, 0, 0, .84), inset 0 1px 0 rgba(255, 236, 196, .16);
  transition: opacity .22s ease, transform .22s ease;
}
.peekbox.show { opacity: 1; transform: translate(-50%, 0); }
.peekbox .pkhead { max-width: 268px; }
.peekbox .pt { font-size: 14px; font-weight: 700; color: #ffe9b0; letter-spacing: 1px; }
.peekbox .pd { font-size: 12px; color: #c8d6c9; margin-top: 6px; line-height: 1.55; }
.peekbox .pn { font-size: 11px; color: #7fd8b0; margin-top: 9px; }
.peekbox .pkcard { display: flex; gap: 10px; }
.peekbox .pkcard .card { --card-w: 104px; --card-h: 122px; animation: peekIn .34s cubic-bezier(.2, .9, .3, 1.2) backwards; }
@keyframes peekIn { 0% { opacity: 0; transform: translateY(14px) scale(.86) rotate(-4deg); } 100% { opacity: 1; transform: none; } }

/* ================= 主界面 ================= */
.menu { text-align: center; }
.menu .mtitle {
  font-family: Georgia, "Times New Roman", "Songti SC", "STSong", "SimSun", serif;
  font-size: 40px; letter-spacing: 10px; color: #f7e9c2;
  text-shadow: 0 0 34px rgba(230, 196, 105, .5), 0 8px 26px #000;
}
.menu .msub { font-size: 12px; letter-spacing: 4px; color: var(--gold-dim); margin-top: 8px; }
.menu .mp {
  max-width: 640px; margin: 20px auto; font-size: 13px; line-height: 1.95;
  color: #c8d6c9; text-align: left;
}
.menu .mp b { color: #ffe9b0; }
.mmodes { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
.mbtn {
  display: flex; flex-direction: column; gap: 5px; align-items: center;
  min-width: 178px; padding: 14px 18px; cursor: pointer; border-radius: 14px;
  border: 1px solid rgba(230, 196, 105, .28);
  background: linear-gradient(180deg, rgba(34, 22, 10, .9), rgba(14, 9, 4, .94));
  color: #ecdfc0; transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
}
.mbtn b { font-size: 15px; letter-spacing: 2px; color: #f6e7c4; }
.mbtn small { font-size: 11px; color: #93a59a; }
.mbtn:hover { border-color: rgba(230, 196, 105, .7); transform: translateY(-2px); }
.mbtn.on { border-color: #f0d489; box-shadow: 0 0 0 2px rgba(240, 212, 137, .25), 0 0 26px rgba(230, 196, 105, .22); }
.menu .mfoot { margin-top: 18px; font-size: 11px; color: #7d8f83; }
.menu .mfoot code { color: var(--gold-dim); }

/* ================= 台面提示：三国杀式大字提示 ================= */
/* 「请打出一张能力牌 / 请出一道角色牌 / 请选择一张你要交换的手牌 / 请选择战利品的处理方式」 */
.prompt .askt {
  flex: 0 0 100%; display: flex; flex-direction: column; align-items: center; gap: 4px;
  margin: 0 0 3px;
}
.prompt .askt b {
  font-family: Georgia, "Times New Roman", "Songti SC", "STSong", "SimSun", serif;
  font-size: 25px; font-weight: 600; letter-spacing: 7px; color: #ffeec4;
  text-shadow: 0 0 28px rgba(255, 196, 96, .5), 0 0 6px rgba(0, 0, 0, .95), 0 5px 16px rgba(0, 0, 0, .95);
}
.prompt .askt i {
  font-style: normal; font-size: 12px; letter-spacing: 2px; color: #cbbc9a;
  text-shadow: 0 2px 8px rgba(0, 0, 0, .96);
}
.prompt .askt::after {
  content: ""; width: min(470px, 62vw); height: 1px; margin-top: 3px;
  background: linear-gradient(90deg, rgba(255, 226, 150, 0), rgba(255, 226, 150, .55), rgba(255, 226, 150, 0));
}
.prompt.dock { max-height: 40vh; }
.prompt.dock .plabel { letter-spacing: 2px; }
.prompt.dock .hint.warn {
  background: rgba(0, 0, 0, .62); border-radius: 20px; padding: 3px 12px;
}

/* 推心置腹「请选择一张你要交换的手牌」：手牌里能点的那几张浮起来，用冷色光区别于「可打出的功能牌」 */
.card.picking {
  transform: translateY(-13px);
  animation: pickPulse 1.7s ease-in-out infinite;
}
@keyframes pickPulse {
  0%, 100% { box-shadow: 0 0 0 2px rgba(150, 226, 255, .72), 0 0 20px rgba(120, 200, 255, .32), 0 14px 26px rgba(0, 0, 0, .66); }
  50% { box-shadow: 0 0 0 2px rgba(210, 242, 255, 1), 0 0 40px rgba(140, 210, 255, .7), 0 14px 26px rgba(0, 0, 0, .66); }
}
.card.picking:hover { transform: translateY(-21px) scale(1.06); }
.card.picking::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(160, 226, 255, .16), rgba(160, 226, 255, 0) 58%);
}

/* 回合转换横幅：比阶段横幅更重，一眼看出换人了 */
.banner[data-kind="turn"] b {
  font-size: 34px; letter-spacing: 10px; color: #fff3d4;
  text-shadow: 0 0 34px rgba(255, 206, 120, .55), 0 6px 22px rgba(0, 0, 0, .85);
}
.banner[data-kind="turn"] i { color: #d9c79c; }

/* ================= 中央判定区：更大氣 ================= */
.arena .arenatitle { font-size: 12.5px; letter-spacing: 4px; color: #dcc286; }
/* 留出左右两侧主牌堆/弃牌堆的位置，别把弃牌堆挤出屏幕 */
.arena.battle { width: min(1180px, 80vw, calc(100vw - 260px)); gap: 14px; }
.arena.battle .arenatitle {
  font-size: 14px; letter-spacing: 6px; opacity: .95; color: #ffe9b0;
  text-shadow: 0 0 22px rgba(255, 196, 96, .45);
}
.arena.battle .slots { gap: 52px; }
.arena.battle .slot { min-height: 176px; gap: 10px; }
.arena.battle .slot .card { --card-w: 124px; --card-h: 146px; border-radius: 13px; }
.arena.battle .slot .card + .card { margin-left: -28px; }
.arena.battle .slot .card .plate b { font-size: 14px; }
.arena.battle .slot .card .plate i { font-size: 10px; }
.arena.battle .slot .card .corner { font-size: 12.5px; }
.arena.battle .vs {
  position: relative; font-size: 27px; letter-spacing: 5px; color: #e6c684;
  text-shadow: 0 0 26px rgba(0, 0, 0, .9), 0 0 44px rgba(255, 196, 96, .3);
}
.arena.battle .vs::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 150px; height: 150px;
  transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
  border: 1px solid rgba(255, 226, 150, .5);
  background: radial-gradient(closest-side, rgba(255, 214, 130, .2), rgba(255, 196, 96, .06) 60%, rgba(255, 196, 96, 0) 78%);
}
.arena.battle .badge { font-size: 14px; padding: 3px 15px; letter-spacing: 1px; }
.arena.battle .verdict { max-width: 1120px; }
.btl-seg.cur .btl-step { font-size: 12px; letter-spacing: 3px; }
.table:has(.arena.battle)::before { width: min(1380px, 95vw); height: min(640px, 70vh); }

/* 宣告阶段也别让中央空荡：出战槽的牌放大一点 */
.slot .card { --card-w: 84px; --card-h: 98px; }
.slot .side .card { --card-w: 104px; --card-h: 122px; }
.slot .side .card .plate b { font-size: 13px; }
.badge.quiet { color: #9d9078; background: rgba(0, 0, 0, .4); border-color: rgba(230, 196, 105, .18); }
/* ================= 需要你点选时：牌桌压暗一档，提示浮到上层 ================= */
/* 避免「台面提示」和中央判定区在矮屏幕上互相打架，也让「轮到你了」更有仪式感 */
.board:has(.prompt.dock)::after {
  content: ""; position: fixed; inset: 0; z-index: 30; pointer-events: none;
  background: radial-gradient(66% 54% at 50% 62%, rgba(0, 0, 0, .58), rgba(0, 0, 0, .32) 62%, rgba(0, 0, 0, 0) 100%);
  animation: scrimIn .26s ease-out backwards;
}
@keyframes scrimIn { 0% { opacity: 0; } 100% { opacity: 1; } }
/* 手牌是你要点的东西，不能被压暗盖住 */
.board:has(.prompt.dock) .seat.me { position: relative; z-index: 34; }

/* 矮屏幕：提示压成一行，判定区的牌也收一点，别和提示抢地方 */
@media (max-height: 960px) {
  /* 矮屏幕才会和中央判定区抢地方：垫一层没有边界的柔光，保证压在任何东西上都读得清（不是框） */
  .prompt.dock::before {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: -1; /* 定位子元素会盖在静态子元素之上，必须压到自己内容下面 */
    width: min(1500px, 150vw); height: calc(100% + 340px); pointer-events: none;
    background: radial-gradient(closest-side, rgba(4, 7, 5, .94), rgba(4, 7, 5, .72) 46%, rgba(4, 7, 5, .26) 76%, rgba(4, 7, 5, 0) 100%);
  }
  .prompt .askt { gap: 2px; }
  .prompt .askt b { font-size: 19px; letter-spacing: 4px; white-space: nowrap; }
  .prompt .askt i { display: none; }
  .prompt .askt::after { display: none; }
  .prompt.dock button.act { font-size: 13px; padding: 8px 17px; }
  .prompt.dock .chip { font-size: 12.5px; padding: 6px 11px; }
  .prompt.dock .fnlist span { font-size: 10.5px; }
  .arena.battle .slot .card { --card-w: 108px; --card-h: 128px; }
  .arena.battle .vs { font-size: 22px; letter-spacing: 3px; }
  .arena.battle .vs::before { width: 116px; height: 116px; }
}
/* 高屏幕下提示不会和中央判定区打架：这条柔光只在矮屏幕的 @media 里生效 */
/* ================= 战利品点选：两张出战牌都放暗，点哪张哪张变亮变大 ================= */
.arena.choosing .slots { align-items: center; }
.pickwrap {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 9px;
  padding: 12px 12px 9px; border-radius: 18px; cursor: pointer;
  transition: transform .24s cubic-bezier(.2, .9, .3, 1.25), filter .22s ease,
              background .22s ease, box-shadow .22s ease;
  filter: grayscale(.34) brightness(.78) contrast(.98);
  background: radial-gradient(120% 100% at 50% 0%, rgba(10, 16, 24, .5), rgba(4, 7, 10, .1) 72%, rgba(0, 0, 0, 0) 100%);
}
.pickwrap .card { transition: transform .22s ease, box-shadow .22s ease; }
.pickwrap .pickhint {
  font-size: 11px; line-height: 1.35; text-align: center; max-width: 172px;
  color: #a9b8c9; text-shadow: 0 1px 3px rgba(0, 0, 0, .95);
}
.pickwrap:hover { filter: grayscale(.2) brightness(.9); transform: translateY(-5px); }
.pickwrap:hover .pickhint { color: #dfe8f2; }
.pickwrap.on {
  filter: brightness(1.32) saturate(1.12); transform: translateY(-14px) scale(1.16);
  background: radial-gradient(120% 100% at 50% 0%, rgba(90, 150, 214, .3), rgba(10, 16, 24, .1) 74%, rgba(0, 0, 0, 0) 100%);
}
.pickwrap.on .card {
  box-shadow: 0 0 0 4px rgba(255, 238, 178, 1), 0 0 48px rgba(255, 214, 120, .8), 0 26px 46px rgba(0, 0, 0, .6);
}
.pickwrap.on .pickhint { color: #a6eccd; font-weight: 700; }
.pickwrap.on::after {
  content: "✓"; position: absolute; top: 4px; right: 8px; width: 22px; height: 22px;
  display: grid; place-items: center; border-radius: 50%; font-size: 13px; font-weight: 700;
  color: #1d2a16; background: linear-gradient(180deg, #cdf3dd, #7fd0ab);
  box-shadow: 0 0 14px rgba(127, 208, 171, .8);
}
.pickwrap:not(.on):hover::after {
  content: "点它"; position: absolute; top: 4px; right: 8px; padding: 2px 8px; border-radius: 20px;
  font-size: 10.5px; letter-spacing: 1px; color: #0e1519; background: rgba(207, 224, 240, .88);
}
.pickline {
  display: block; margin: 7px 0 3px; font-size: 13px; letter-spacing: 1px;
  color: #9fb3c6; text-shadow: 0 1px 4px rgba(0, 0, 0, .95);
}
.pickline.on { color: #a6eccd; font-weight: 700; }
/* ================= 配色分级：不同层用不同色系，字不再糊在一起 ================= */
/* 信息/中性=石板蓝 · 需要你操作=鎏金 · 损失/被夺走=砖红 · 收益/回到手里=青绿 */
:root {
  --c-neutral: #8fa9c4;
  --c-action: #e6c469;
  --c-danger: #e0a08c;
  --c-gain: #9fe6c8;
  --c-panel: rgba(13, 20, 32, .95);
}

/* 台面大字提示：底色换成冷色石板，和暖金卡面、绿毡桌子明确分层 */
.prompt.dock {
  padding: 12px 24px 13px; border-radius: 16px;
  border: 1px solid rgba(143, 169, 196, .4);
  background: radial-gradient(130% 140% at 50% 0%, rgba(41, 56, 79, .96), var(--c-panel) 62%, rgba(6, 10, 18, .97) 100%);
  box-shadow: 0 24px 62px rgba(0, 0, 0, .82), 0 0 0 1px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(206, 224, 244, .16);
}
.prompt.dock .askt b { color: #fff3d2; }
.prompt.dock .askt i { color: #a9bdd4; }
.prompt.dock .askt::after {
  background: linear-gradient(90deg, rgba(143, 169, 196, 0), rgba(143, 169, 196, .8), rgba(143, 169, 196, 0));
}
.prompt.dock .plabel {
  color: #d6e4f4; background: rgba(143, 169, 196, .18); border-right: 0;
}
.prompt.dock .hint { color: #c9d8e8; background: rgba(143, 169, 196, .14); }
.prompt.dock .hint.warn { color: #ffc0a8; background: rgba(224, 160, 140, .18); }
.prompt.dock .chip { background: rgba(9, 14, 24, .88); border-color: rgba(143, 169, 196, .42); }
.prompt.dock .chip.on {
  background: linear-gradient(180deg, #f0d489, #b8923c); border-color: #f0d489; color: #241c05; font-weight: 700;
}
.prompt.dock button.act.secondary {
  background: linear-gradient(180deg, rgba(40, 55, 78, .98), rgba(12, 18, 28, .98));
  border-color: rgba(143, 169, 196, .5); color: #dde8f5;
}
.prompt.dock .fnlist span { color: #b7c8dc; }

/* 损失类文字（不出战惩罚、被夺走、克制成败）统一砖红，和金色主按钮分开 */
.hint.warn { color: #f0ab93; }
.turnbar .zhi { color: #f0ab93; }

/* ================= 主界面：放大版 ================= */
.ovcard:has(.menu) {

    linear-gradient(180deg, #16202e 0%, #101724 52%, #080c13 100%);

}
.menu { text-align: center; }
.menu .mhero { padding: 4px 0 16px; }
.menu .mcrest {

}

.menu .mp b { color: #ffe9b0; }
.mmodes { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 22px 0 16px; }
.mbtn {

.mbtn .mnote { grid-column: 2; margin-top: 6px; font-size: 10.5px; letter-spacing: 1px; color: #6f8497; }

.mbtn.on {

.mkeys { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
.mkeys span {

}

/* 战利品小字加一层底，未选的那张也看得清 */

}

/* ================= 主界面 · 联机房间（开房 / 邀请码） ================= */
.monline {
  margin: 18px 0 4px; padding: 14px 16px; border-radius: 14px;
  border: 1px solid rgba(143, 169, 196, .3); background: rgba(10, 15, 24, .62);
}

.monline .molhead b { color: #ffe9b0; letter-spacing: 4px; font-size: 16px; }
.monline .molrow { display: flex; gap: 9px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 11px 0 8px; }

/* =====================================================================
   v4 重构：三国杀式牌桌 —— 明亮暖色石板桌面 / 中央判定区 / 右侧战报 /
   手牌右上角操作按钮 / 桌面浮层弹窗（弹出即走，不占位）
   ===================================================================== */
:root {
  --gold: #f0cf7c;
  --gold-dim: #b8994f;
  --line: rgba(240, 207, 124, .28);
  --table-1: #a98a63;
  --table-2: #8a6f4b;
  --table-3: #644f33;
  --panel: rgba(26, 20, 14, .94);
  --rail-bg: linear-gradient(180deg, rgba(38, 30, 21, .97), rgba(22, 17, 12, .97));
  --c-neutral: #9dbcdd;
  --c-action: #f2cd72;
  --c-danger: #e8a08c;
  --c-gain: #8fe3bf;
}

html, body {
  background:
    radial-gradient(120% 90% at 50% 0%, #3b2f20 0%, #241c14 55%, #16110b 100%);
  color: #f4ead5;
}

/* ---------------- 顶栏 ---------------- */
.topbar {
  padding: 7px 16px;
  border-bottom: 1px solid rgba(240, 207, 124, .3);
  background: linear-gradient(180deg, rgba(58, 45, 30, .98), rgba(33, 25, 17, .96));
  box-shadow: 0 6px 22px rgba(0, 0, 0, .55);
}
.title { color: #ffeec2; font-size: 19px; }
.ghost { background: rgba(240, 207, 124, .12); color: #f6ecd4; }
.ghost.primary { background: linear-gradient(180deg, #f0d489, #b8923c); color: #2a2109; font-weight: 700; }
.ph { color: #c3b393; background: rgba(255, 255, 255, .07); }
.ph.done { color: #e6d9bb; border-color: rgba(240, 207, 124, .3); }
.seedline { color: #c9bda1; }

/* ---------------- 主体：牌桌 + 右侧战报 ---------------- */
.board {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 250px;
  grid-template-rows: minmax(0, 1fr);
  gap: 10px;
  padding: 10px 12px 12px;
  overflow: hidden;
}
.board::after { content: none; }

.felt {
  position: relative;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 6px;
  min-height: 0;
  padding: 8px 10px 6px;
  border-radius: 16px;
  background:
    radial-gradient(46% 40% at 50% 44%, rgba(255, 226, 168, .22), transparent 72%),
    radial-gradient(126% 104% at 50% 40%, rgba(255, 232, 190, .1) 0%, rgba(0, 0, 0, 0) 46%, rgba(0, 0, 0, .26) 100%),
    repeating-linear-gradient(93deg, rgba(0, 0, 0, .07) 0 2px, rgba(255, 236, 200, .04) 2px 4px),
    linear-gradient(168deg, var(--table-1) 0%, var(--table-2) 46%, var(--table-3) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255, 226, 168, .22),
    inset 0 0 0 6px rgba(0, 0, 0, .16),
    inset 0 0 90px rgba(0, 0, 0, .38),
    0 18px 44px rgba(0, 0, 0, .5);
}
/* 桌面中央的鎏金圆纹（三国杀那种底纹），不抢戏 */
.felt::before {
  content: "";
  position: absolute;
  left: 50%; top: 46%;
  width: min(58vh, 46vw); aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  pointer-events: none;
  opacity: .3;
  background:
    radial-gradient(circle, transparent 58%, rgba(255, 226, 168, .5) 58.4%, transparent 60%),
    radial-gradient(circle, transparent 74%, rgba(255, 226, 168, .32) 74.4%, transparent 76%),
    conic-gradient(from 0deg, rgba(255, 226, 168, .16) 0 6deg, transparent 6deg 30deg,
      rgba(255, 226, 168, .16) 30deg 36deg, transparent 36deg 60deg),
    radial-gradient(circle, rgba(255, 226, 168, .22) 0 18%, transparent 42%);
  -webkit-mask-image: radial-gradient(circle, #000 0 62%, transparent 74%);
  mask-image: radial-gradient(circle, #000 0 62%, transparent 74%);
}

.seat { position: relative; z-index: 2; }
.seat.opp { padding-top: 2px; }
.seathead { color: #f2e6cc; }
.who { font-weight: 700; letter-spacing: .5px; }
.avatar { filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .6)); }
.handcount { color: var(--gold); font-weight: 700; }

/* ---------------- 中央判定区：不要框 ---------------- */
.arena {
  width: auto; max-width: none; margin: 0;
  background: transparent; border: 0; box-shadow: none; padding: 0;
  justify-content: center; gap: 10px;
}
.arena::after, .arena::before { content: none !important; }
.arenatitle {
  font-size: 12px; letter-spacing: 6px; color: #ffe3a6;
  text-shadow: 0 2px 10px rgba(0, 0, 0, .85); opacity: .9;
}
.verdict {
  color: #fdf1d6; background: transparent; text-shadow: 0 2px 12px rgba(0, 0, 0, .9);
  font-size: 13.5px; max-width: 900px;
}
.slots { gap: 40px; }
.slot { min-height: 130px; }

/* 判定区放大版：把身份对决画大，文字让位 */
.arena.battle { width: min(1240px, 84vw, calc(100vw - 400px)); gap: 12px; }
.arena.battle .slots { gap: 64px; }
.arena.battle .slot { min-height: 210px; gap: 12px; }
.arena.battle .slot .card { --card-w: 148px; --card-h: 174px; border-radius: 15px; }
.arena.battle .slot .card + .card { margin-left: -34px; }
.arena.battle .slot .card .plate b { font-size: 16px; }
.arena.battle .slot .card .plate i { font-size: 11px; }
.arena.battle .slot .card .corner { font-size: 14px; }
.arena.battle .vs { font-size: 30px; color: #ffe6ae; }
.arena.battle .badge { font-size: 15px; padding: 4px 18px; }
.arena.battle .verdict { max-width: 1240px; font-size: 16px; line-height: 1.6; }
.arena.battle .btl { gap: 10px; }

/* ---------------- 手牌区 + 右上角操作按钮 ---------------- */
.seat.me { position: relative; }
.handrow {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 12px; min-height: 34px; padding: 0 4px;
}
.turnbar {
  font-size: 12.5px; color: #f0e4c8;
  background: rgba(24, 18, 12, .78); border: 1px solid rgba(240, 207, 124, .22);
  border-radius: 20px; padding: 5px 14px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .5);
}
.prompt {
  display: flex; align-items: center; justify-content: flex-end;
  flex-wrap: wrap; gap: 7px;
  margin: 0; padding: 0; background: transparent; border: 0; box-shadow: none;
  max-width: 72%;
}
.prompt::after { content: none !important; }
.prompt.mine { background: transparent; border: 0; }
.prompt .askt {
  display: flex; align-items: baseline; gap: 8px;
  background: transparent; border: 0; box-shadow: none; padding: 0 4px;
  animation: askIn .34s cubic-bezier(.2, .9, .3, 1.2);
}
.prompt .askt::after { content: none !important; }
.prompt .askt b {
  font-size: 16px; letter-spacing: 2px; color: #ffe6ae;
  text-shadow: 0 0 18px rgba(255, 190, 90, .55), 0 2px 10px rgba(0, 0, 0, .95);
}
.prompt .askt i { font-size: 11.5px; color: #cbbf9f; font-style: normal; }
.prompt .plabel { display: none; }
.prompt .hint {
  font-size: 12px; color: #cdc2a4; background: rgba(24, 18, 12, .7);
  border-radius: 14px; padding: 4px 12px;
}
.prompt .chip {
  font-size: 13px; padding: 6px 13px; border-radius: 10px;
  background: rgba(20, 15, 10, .9); border: 1px solid rgba(240, 207, 124, .38);
  color: #f7edd6; cursor: pointer;
  transition: transform .13s ease, box-shadow .13s ease, background .13s ease;
}
.prompt .chip:hover { transform: translateY(-2px); background: rgba(48, 36, 20, .95); }
.prompt .chip.on {
  background: linear-gradient(180deg, #f3d68f, #b8923c); color: #241c05; font-weight: 700;
  border-color: #ffeec2; box-shadow: 0 0 16px rgba(240, 207, 124, .6);
}
.prompt .chip.fn { border-color: rgba(143, 227, 191, .5); }
.prompt button.act {
  font-size: 13.5px; padding: 8px 18px; border-radius: 10px;
  background: linear-gradient(180deg, #f0d489, #b8923c); color: #241c05; font-weight: 700;
  border: 1px solid rgba(255, 238, 194, .7); cursor: pointer;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .5);
}
.prompt button.act:hover { filter: brightness(1.08); }
.prompt button.act[disabled] { opacity: .4; cursor: not-allowed; filter: grayscale(.5); }
.prompt button.act.secondary {
  background: rgba(22, 17, 11, .9); color: #f0e4c8; border-color: rgba(240, 207, 124, .34);
  font-weight: 600; box-shadow: 0 6px 16px rgba(0, 0, 0, .45);
}
.prompt .fnlist { display: none; }
.prompt .pickline {
  font-size: 12.5px; padding: 4px 12px; border-radius: 14px;
  background: rgba(24, 18, 12, .8); color: #cdc2a4; border: 1px dashed rgba(240, 207, 124, .3);
}
.prompt .pickline.on { color: #241c05; background: linear-gradient(180deg, #f3d68f, #b8923c); border-style: solid; font-weight: 700; }

/* 需要你操作时，整条操作区发金光，一眼看到 */
.prompt.mine { animation: actionPulse 1.6s ease-in-out infinite; }
@keyframes actionPulse {
  0%, 100% { filter: none; }
  50% { filter: drop-shadow(0 0 12px rgba(255, 206, 110, .5)); }
}
@keyframes askIn {
  from { opacity: 0; transform: translateY(8px) scale(.96); }
  to { opacity: 1; transform: none; }
}

/* ---------------- 角落牌堆 ---------------- */
.pile.corner {
  position: absolute; z-index: 3; margin: 0; gap: 3px;
  padding: 6px 8px 5px; border-radius: 12px;
  background: rgba(24, 18, 12, .66); border: 1px solid rgba(240, 207, 124, .2);
  backdrop-filter: blur(2px);
}
.pile.corner .pilelabel { font-size: 10px; letter-spacing: 2px; }
.pile.corner.deck { top: 6px; right: 8px; }
.pile.corner.discard { top: 6px; right: 92px; }
.pile.corner .pilecards { --card-w: 42px; --card-h: 50px; }
.pile.corner .pilecards .layer { position: absolute; }
.pile.corner .pilecards { position: relative; width: 46px; height: 54px; }
.pile.corner .pilecount {
  position: absolute; right: -6px; top: -6px;
  background: linear-gradient(180deg, #f0d489, #b8923c); color: #241c05;
  border-radius: 10px; padding: 0 6px; font-size: 11px; box-shadow: 0 3px 8px rgba(0, 0, 0, .6);
}
.chk.corner.opt { position: absolute; right: 8px; bottom: 6px; z-index: 3; }
.chk.corner.opt2 { position: absolute; right: 8px; bottom: 26px; z-index: 3; }
.chk { color: #e6d9bb; }

/* ---------------- 右侧战报栏 ---------------- */
.rail {
  display: flex; flex-direction: column; min-height: 0; gap: 8px;
  border-radius: 16px; padding: 10px 10px 8px;
  background: var(--rail-bg);
  border: 1px solid rgba(240, 207, 124, .26);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .5), 0 16px 36px rgba(0, 0, 0, .5);
  overflow: hidden;
}
.rail.hidden { display: none !important; }
.loghead {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; color: #ffe6ae; letter-spacing: 2px;
  padding-bottom: 8px; border-bottom: 1px solid rgba(240, 207, 124, .18);
}
.tabs { display: flex; gap: 6px; }
.tabs button {
  flex: 1; font-size: 12px; padding: 6px 0; border-radius: 9px; cursor: pointer;
  background: rgba(255, 255, 255, .05); color: #cdc2a4;
  border: 1px solid rgba(240, 207, 124, .16);
}
.tabs button.on { background: linear-gradient(180deg, #f0d489, #b8923c); color: #241c05; font-weight: 700; }
.log {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  font-size: 12.5px; line-height: 1.62; color: #dcd0b4;
  display: flex; flex-direction: column; gap: 5px; padding-right: 4px;
}
.log > div {
  padding: 4px 8px; border-radius: 8px;
  background: rgba(255, 255, 255, .04);
  border-left: 3px solid rgba(157, 188, 221, .55);
  animation: logIn .3s ease backwards;
}
.log > div.lv-private { border-left-color: rgba(143, 227, 191, .8); background: rgba(143, 227, 191, .1); }
.log::-webkit-scrollbar { width: 8px; }
.log::-webkit-scrollbar-thumb { background: rgba(240, 207, 124, .28); border-radius: 4px; }
@keyframes logIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }

/* ---------------- 桌面浮层弹窗（弹出即走） ---------------- */
.popups {
  position: absolute; inset: 0; z-index: 30;
  display: flex; flex-direction: column; align-items: center;
  gap: 6px; padding-top: 5.5%; pointer-events: none;
}
.popup {
  min-width: 0; max-width: min(560px, 62%);
  padding: 8px 22px; border-radius: 12px; text-align: center;
  background: linear-gradient(180deg, rgba(46, 36, 24, .96), rgba(26, 20, 14, .96));
  border: 1px solid rgba(240, 207, 124, .5);
  box-shadow: 0 18px 46px rgba(0, 0, 0, .7), inset 0 0 30px rgba(255, 206, 110, .12);
  animation: popIn .34s cubic-bezier(.2, .9, .3, 1.25), popOut .5s ease 1.7s forwards;
}
.popup b { display: block; font-size: 19px; letter-spacing: 4px; color: #ffe6ae; white-space: nowrap;
  text-shadow: 0 0 22px rgba(255, 190, 90, .6); }
.popup i { display: block; margin-top: 5px; font-size: 12.5px; font-style: normal; color: #d3c7a8; letter-spacing: 1px; }
.popup.k-turn { border-color: rgba(240, 207, 124, .6); }
.popup.k-gain { border-color: rgba(143, 227, 191, .7); }
.popup.k-gain b { color: #c9f7e2; text-shadow: 0 0 22px rgba(120, 230, 180, .5); }
.popup.k-loss { border-color: rgba(232, 160, 140, .7); }
.popup.k-loss b { color: #ffcdbc; text-shadow: 0 0 22px rgba(230, 130, 100, .5); }
.popup.k-info { border-color: rgba(157, 188, 221, .6); }
.popup.k-info b { color: #d9e8fb; text-shadow: 0 0 22px rgba(140, 180, 230, .45); }
@keyframes popIn { from { opacity: 0; transform: translateY(-16px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes popOut { to { opacity: 0; transform: translateY(-14px) scale(.97); } }

/* ---------------- 通用按钮 / 面板提亮 ---------------- */
button.act {
  background: linear-gradient(180deg, #f0d489, #b8923c); color: #241c05; font-weight: 700;
  border: 1px solid rgba(255, 238, 194, .7); border-radius: 10px; padding: 9px 20px;
  cursor: pointer; font-size: 14px; box-shadow: 0 6px 18px rgba(0, 0, 0, .5);
}
button.act.secondary { background: rgba(22, 17, 11, .92); color: #f0e4c8; border-color: rgba(240, 207, 124, .34); }
button.act[disabled] { opacity: .45; cursor: not-allowed; }
.overlay { background: radial-gradient(70% 60% at 50% 40%, rgba(20, 15, 10, .82), rgba(6, 4, 2, .94)); }
.ovcard {
  background: linear-gradient(180deg, rgba(44, 34, 23, .98), rgba(24, 18, 12, .98));
  border: 1px solid rgba(240, 207, 124, .34);
  box-shadow: 0 30px 80px rgba(0, 0, 0, .8), inset 0 0 60px rgba(255, 206, 110, .07);
}
.banner b { color: #ffe6ae; }
.banner i { color: #d8cca9; }

/* ---------------- 自适应 ---------------- */
@media (max-width: 1180px) {
  .board { grid-template-columns: minmax(0, 1fr) 228px; }
  .arena.battle { width: min(1000px, 92vw); }
  .arena.battle .slot .card { --card-w: 124px; --card-h: 146px; }
}
@media (max-width: 960px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .rail { position: absolute; right: 10px; top: 56px; bottom: 12px; width: 254px; z-index: 40; }
  .rail.hidden { display: none !important; }
}

/* v4 补丁：.prompt.dock（老图层把提示画成了大框）全部推平，只留手牌右上角的一排按钮 */
.prompt.dock {
  position: static; max-height: none; width: auto; max-width: 62%;
  align-items: flex-end; justify-content: flex-end; flex-wrap: wrap;
  background: transparent !important; border: 0 !important; box-shadow: none !important;
  padding: 0 !important; gap: 7px;
}
.prompt.dock::before, .prompt.dock::after { content: none !important; }
.prompt.dock .askt {
  background: transparent; border: 0; box-shadow: none; padding: 0 4px 0 0; text-align: right;
  display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
}
.prompt.dock .askt b { font-size: 17px; letter-spacing: 2px; color: #ffe6ae; }
.prompt.dock .askt i { color: #cfc2a2; font-size: 11.5px; }
.prompt.dock .hint {
  background: rgba(24, 18, 12, .8); border: 1px solid rgba(240, 207, 124, .22);
  color: #ded1b2; font-size: 12px; padding: 5px 12px; border-radius: 14px;
}
.prompt.dock .chip {
  background: rgba(18, 14, 9, .92); border-color: rgba(240, 207, 124, .45);
  color: #f8eed6; font-size: 13px; padding: 7px 14px;
  box-shadow: 0 5px 14px rgba(0, 0, 0, .5);
}
.prompt.dock .chip.fn { border-color: rgba(143, 227, 191, .75); box-shadow: 0 0 14px rgba(143, 227, 191, .28); }
.prompt.dock .chip.on { background: linear-gradient(180deg, #f3d68f, #b8923c); color: #241c05; border-color: #ffeec2; }
.prompt.dock button.act { font-size: 13.5px; padding: 8px 18px; border-radius: 10px; }
.prompt.dock button.act.secondary { background: rgba(18, 14, 9, .92); color: #f0e4c8; }
.prompt.dock .fnlist { display: none !important; }
.prompt.dock .plabel { display: none; }

/* 牌堆：主牌堆在右上角，弃牌堆排在它正下方，互不压字 */
.pile.corner.deck { top: 8px; right: 10px; }
.pile.corner.discard { top: 104px; right: 10px; }
.pile.corner .pilecards { width: 42px; height: 50px; }
.pile.corner .pilelabel { font-size: 9.5px; letter-spacing: 1px; }
.chk.corner.opt { bottom: 8px; right: 12px; }
.chk.corner.opt2 { bottom: 30px; right: 12px; }

/* 横幅上移，桌面浮层下移，别叠在一起 */
.banner { top: 3.2% !important; }
.banner b { font-size: 26px; letter-spacing: 9px; }
.banner i { font-size: 11.5px; }
.popups { padding-top: 15%; }

/* 角上的牌堆再收小一点，别顶到边框 */
.pile.corner { padding: 5px 7px 4px; }
.pile.corner .pilecards { width: 38px; height: 46px; }
.pile.corner .pilecount { right: -2px; top: -4px; font-size: 10px; padding: 0 5px; }
.popups { padding-top: 13%; }

/* ---------------- v4 主界面：暖色鎏金大厅 ---------------- */
.overlay:has(.menu) { background: radial-gradient(80% 70% at 50% 34%, rgba(30, 22, 14, .86), rgba(6, 4, 2, .96)); }

/* =====================================================================
   v5 精简：右侧栏收窄 · 提示不叠字 · 牌桌更亮 · 手牌直接点出牌
   ===================================================================== */
